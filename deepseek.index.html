<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek Chat</title>
    <style>
        :root {
            --bg: #ffffff;
            --sidebar-bg: #f9fafb;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --bubble-user: #e0e7ff;
            --bubble-ai: #ffffff;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --radius: 16px;
            --radius-sm: 10px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }
        /* 侧边栏 */
        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform .3s;
        }
        #sidebar.hidden { transform: translateX(-100%); position: absolute; z-index: 50; height: 100%; }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        #btnNewChat {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .2s;
        }
        #btnNewChat:hover { background: #f3f4f6; }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background .15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover { background: #e5e7eb; }
        .chat-item.active { background: #dbeafe; color: var(--accent); font-weight: 600; }
        .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: opacity .15s;
        }
        .chat-item:hover .delete-btn { opacity: 1; }
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 4px;
        }
        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .sidebar-footer button:hover { background: #f3f4f6; }
        /* 主区域 */
        #mainArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        #btnToggleSidebar {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }
        .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
        }
        .header-actions { margin-left: auto; display: flex; gap: 6px; }
        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: #f3f4f6; }
        /* 聊天区域 */
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn .3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.user .avatar { background: var(--accent); color: #fff; }
        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user .bubble { background: var(--bubble-user); color: #1e1b4b; border-bottom-right-radius: 4px; }
        .message.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .thinking { display: flex; gap: 4px; padding: 8px 0; }
        .thinking span { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: dot 1.2s infinite; }
        .thinking span:nth-child(2) { animation-delay: .2s; }
        .thinking span:nth-child(3) { animation-delay: .4s; }
        @keyframes dot { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }
        /* 输入区 */
        #inputArea {
            padding: 12px 20px 20px;
            background: #fff;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 8px 6px 16px;
            transition: border-color .2s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); background: #fff; }
        #userInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            font-family: var(--font);
            resize: none;
            outline: none;
            max-height: 150px;
            line-height: 1.5;
            padding: 4px 0;
        }
        #sendBtn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:hover { background: var(--accent-hover); }
        #sendBtn:disabled { opacity: 0.5; pointer-events: none; }
        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            width: 90vw;
            max-width: 420px;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-primary { background: var(--accent); color: #fff; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: #f3f4f6; color: var(--text); border: 1px solid var(--border); }
        @media (max-width: 640px) {
            #sidebar { position: absolute; z-index: 50; height: 100%; }
            #sidebar.hidden { transform: translateX(-100%); }
            .message { max-width: 90%; }
            #chatArea { padding: 12px; }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button id="btnNewChat">＋ 新建对话</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <button id="btnSettings">⚙️ 设置</button>
            <button id="btnClear">🗑️ 清空</button>
        </div>
    </div>

    <!-- 主区域 -->
    <div id="mainArea">
        <div id="header">
            <button id="btnToggleSidebar">☰</button>
            <span class="logo">DeepSeek Chat</span>
        </div>
        <div id="chatArea">
            <div class="message ai">
                <div class="avatar">🤖</div>
                <div class="bubble">你好！我是 DeepSeek Chat。选择一个对话或新建一个开始聊天。</div>
            </div>
        </div>
        <div id="inputArea">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="发送消息... (Enter 发送，Shift+Enter 换行)"></textarea>
                <button id="sendBtn">↑</button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ 设置</h3>
            <div class="form-group">
                <label>🔑 API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>🤖 模型</label>
                <select id="modelSelect">
                    <option value="deepseek-chat">deepseek-chat</option>
                    <option value="deepseek-reasoner">deepseek-reasoner</option>
                </select>
            </div>
            <button class="btn btn-primary" id="saveSettings">保存</button>
            <button class="btn btn-secondary" style="margin-top:8px;width:100%;" id="closeModal">取消</button>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'ds_multi_chat';
            const API_URL = 'https://api.deepseek.com/v1/chat/completions';

            let settings = { apiKey: '', model: 'deepseek-chat' };
            let chats = {};          // { chatId: { title: '', messages: [] } }
            let chatOrder = [];      // 按创建顺序排列的 chatId
            let currentChatId = null;

            // 加载数据
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    settings = data.settings || settings;
                    chats = data.chats || {};
                    chatOrder = data.chatOrder || [];
                    currentChatId = data.currentChatId || null;
                }
            } catch (e) {}

            function save() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        settings, chats, chatOrder, currentChatId
                    }));
                } catch (e) {}
            }

            function createNewChat() {
                const id = 'chat_' + Date.now();
                chats[id] = { title: '新对话', messages: [] };
                chatOrder.unshift(id);
                currentChatId = id;
                save();
                renderAll();
            }

            function deleteChat(id) {
                if (!confirm('确定删除这个对话吗？')) return;
                delete chats[id];
                chatOrder = chatOrder.filter(c => c !== id);
                if (currentChatId === id) {
                    currentChatId = chatOrder[0] || null;
                }
                save();
                renderAll();
            }

            function switchChat(id) {
                currentChatId = id;
                save();
                renderChatArea();
                renderChatList();
            }

            function getCurrentChat() {
                return currentChatId ? chats[currentChatId] : null;
            }

            const $ = s => document.querySelector(s);
            const chatArea = $('#chatArea');
            const userInput = $('#userInput');
            const sendBtn = $('#sendBtn');
            const sidebar = $('#sidebar');
            const chatListEl = $('#chatList');

            let isStreaming = false;

            function renderAll() {
                renderChatList();
                renderChatArea();
                // 如果没有对话，自动新建一个
                if (!currentChatId && chatOrder.length === 0) {
                    createNewChat();
                }
            }

            function renderChatList() {
                chatListEl.innerHTML = '';
                chatOrder.forEach(id => {
                    const chat = chats[id];
                    if (!chat) return;
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
                    div.innerHTML = `
                        <span class="title">${escapeHtml(chat.title || '新对话')}</span>
                        <button class="delete-btn" data-id="${id}">✕</button>
                    `;
                    div.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('delete-btn')) {
                            switchChat(id);
                        }
                    });
                    div.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteChat(id);
                    });
                    chatListEl.appendChild(div);
                });
            }

            function renderChatArea() {
                chatArea.innerHTML = '';
                const chat = getCurrentChat();
                if (!chat || chat.messages.length === 0) {
                    chatArea.innerHTML = `
                        <div class="message ai">
                            <div class="avatar">🤖</div>
                            <div class="bubble">你好！我是 DeepSeek Chat。开始一个新对话吧。</div>
                        </div>`;
                } else {
                    chat.messages.forEach(msg => {
                        const div = createMessageElement(msg.role, msg.content);
                        chatArea.appendChild(div);
                    });
                }
                scrollBottom();
            }

            function createMessageElement(role, content) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message ' + (role === 'user' ? 'user' : 'ai');
                wrapper.innerHTML = `
                    <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                    <div class="bubble">${escapeHtml(content)}</div>
                `;
                return wrapper;
            }

            function escapeHtml(str) {
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function scrollBottom() {
                requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
            }

            function addMessage(role, content) {
                const chat = getCurrentChat();
                if (!chat) return;
                chat.messages.push({ role, content });
                // 自动更新对话标题
                if (chat.messages.length === 1 && role === 'user') {
                    chat.title = content.substring(0, 30);
                }
                chatArea.appendChild(createMessageElement(role, content));
                scrollBottom();
                save();
                renderChatList();
            }

            async function sendMessage() {
                const text = userInput.value.trim();
                if (!text || isStreaming) return;
                if (!settings.apiKey) {
                    alert('请先点击侧边栏 ⚙️ 设置 API Key');
                    return;
                }
                isStreaming = true;
                sendBtn.disabled = true;
                userInput.value = '';
                userInput.style.height = 'auto';

                // 确保有当前对话
                if (!currentChatId) createNewChat();
                addMessage('user', text);

                // 思考指示器
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'message ai';
                thinkingDiv.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>';
                chatArea.appendChild(thinkingDiv);
                scrollBottom();

                const chat = getCurrentChat();
                const messages = [
                    { role: 'system', content: '你是一个有用的AI助手，由深度求索公司创造。请用中文回答。' },
                    ...chat.messages.slice(-10).map(m => ({ role: m.role, content: m.content }))
                ];

                try {
                    const resp = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`
                        },
                        body: JSON.stringify({
                            model: settings.model,
                            messages,
                            stream: true,
                            max_tokens: 2048,
                            temperature: 0.7
                        }),
                        signal: AbortSignal.timeout(120000)
                    });
                    if (!resp.ok) {
                        const err = await resp.text().catch(() => '');
                        throw new Error(`API 错误 ${resp.status}: ${err.substring(0, 150)}`);
                    }

                    thinkingDiv.remove();
                    const aiDiv = createMessageElement('ai', '');
                    chatArea.appendChild(aiDiv);
                    const bubble = aiDiv.querySelector('.bubble');
                    let fullContent = '';

                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            if (!line.trim() || !line.startsWith('data:')) continue;
                            const str = line.slice(5).trim();
                            if (str === '[DONE]') continue;
                            try {
                                const delta = JSON.parse(str).choices?.[0]?.delta?.content || '';
                                fullContent += delta;
                                bubble.textContent = fullContent;
                                scrollBottom();
                            } catch (e) {}
                        }
                    }
                    chat.messages.push({ role: 'assistant', content: fullContent });
                    save();
                } catch (err) {
                    thinkingDiv.remove();
                    const errDiv = createMessageElement('ai', `⚠️ 请求失败: ${err.message}`);
                    chatArea.appendChild(errDiv);
                } finally {
                    isStreaming = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                    scrollBottom();
                }
            }

            // 事件绑定
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
            });
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            $('#btnNewChat').addEventListener('click', createNewChat);
            $('#btnToggleSidebar').addEventListener('click', () => sidebar.classList.toggle('hidden'));
            $('#btnClear').addEventListener('click', () => {
                if (confirm('清空当前对话的所有消息？')) {
                    const chat = getCurrentChat();
                    if (chat) { chat.messages = []; save(); renderChatArea(); }
                }
            });

            $('#btnSettings').addEventListener('click', () => {
                $('#apiKeyInput').value = settings.apiKey;
                $('#modelSelect').value = settings.model;
                $('#settingsModal').classList.add('show');
            });
            $('#closeModal').addEventListener('click', () => $('#settingsModal').classList.remove('show'));
            $('#settingsModal').addEventListener('click', (e) => { if (e.target === $('#settingsModal')) $('#settingsModal').classList.remove('show'); });

            $('#saveSettings').addEventListener('click', () => {
                settings.apiKey = $('#apiKeyInput').value.trim();
                settings.model = $('#modelSelect').value;
                save();
                $('#settingsModal').classList.remove('show');
            });

            // 启动
            renderAll();
        })();
    </script>
</body>
</html>
