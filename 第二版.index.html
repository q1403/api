<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>多元宇宙穿梭 · AI角色扮演</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        :root {
            --bg: #1e1e2e;
            --bg-secondary: #2a2a3c;
            --bg-tertiary: #353550;
            --text: #e8e6f0;
            --text-secondary: #b0b0c0;
            --accent: #7c6ff7;
            --accent-glow: #a594ff;
            --npc-bubble: #2d2b40;
            --player-bubble: #262d40;
            --npc-bar-bg: #232135;
            --player-bar-bg: #1b2230;
            --danger: #ff6b7a;
            --success: #5fe69c;
            --border: #3e3e56;
            --shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
            --radius: 16px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            --bg-image: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 46, 0.85);
            z-index: 0;
            pointer-events: none;
        }
        body.has-custom-bg::before {
            background: rgba(30, 30, 46, 0.7);
        }

        /* 应用容器，置于伪元素上方 */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(42, 42, 60, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            gap: 8px;
            flex-shrink: 0;
            min-height: 50px;
        }
        .world-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            padding: 6px 14px;
            cursor: pointer;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-glow);
            white-space: nowrap;
            transition: var(--transition);
        }
        .world-selector:active {
            transform: scale(0.96);
            border-color: var(--accent);
        }
        .top-bar-actions {
            display: flex;
            gap: 6px;
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }
        .btn-icon:active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(0.9);
        }
        .btn-icon .tooltip {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .btn-icon:active .tooltip {
            opacity: 1;
        }

        /* NPC 状态栏 */
        .npc-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(35, 33, 53, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #3e3458;
            flex-shrink: 0;
            cursor: pointer;
            transition: var(--transition);
        }
        .npc-avatar-frame {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: #2a2338;
            flex-shrink: 0;
        }
        .npc-info {
            flex: 1;
            min-width: 0;
        }
        .npc-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #e0d8f0;
        }
        .npc-mood {
            font-size: 0.7rem;
            color: #b8a8d0;
        }
        .affection-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .affection-num {
            font-weight: 700;
            color: var(--accent-glow);
        }

        /* 对话区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .message-bubble {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 0.9rem;
            word-break: break-word;
            animation: bubble-in 0.3s ease-out;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .message-bubble.npc {
            align-self: flex-start;
            background: var(--npc-bubble);
            border: 1px solid #3e3458;
            border-bottom-left-radius: 6px;
            color: #e8ddf8;
        }
        .message-bubble.player {
            align-self: flex-end;
            background: var(--player-bubble);
            border: 1px solid #2e3b50;
            border-bottom-right-radius: 6px;
            color: #d0ddf0;
        }
        .message-bubble .sender-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
            opacity: 0.7;
        }
        .typing-cursor::after {
            content: '▌';
            animation: blink 0.8s step-end infinite;
            color: var(--accent);
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        @keyframes bubble-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            align-self: flex-start;
        }
        .loading-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: dot-bounce 1.2s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes dot-bounce {
            0%,
            80%,
            100% {
                transform: scale(0.5);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 选项区域 */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 14px;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: rgba(42, 42, 60, 0.9);
            backdrop-filter: blur(8px);
            min-height: 50px;
            align-items: center;
        }
        .option-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1.5px solid var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            font-family: var(--font-ui);
            white-space: nowrap;
        }
        .option-btn:active {
            background: var(--accent);
            color: #fff;
            transform: scale(0.94);
        }
        .option-btn:disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .free-input-row {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 4px;
        }
        .free-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: var(--font-ui);
        }
        .free-input-row input:focus {
            border-color: var(--accent);
        }
        .free-input-row button {
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* 主角面板 */
        .player-panel-toggle {
            position: fixed;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(27, 34, 48, 0.9);
            border: 2px solid #3e5070;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8ab8e0;
            box-shadow: var(--shadow);
        }
        .player-panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .player-panel-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .player-panel {
            position: fixed;
            right: -320px;
            top: 0;
            bottom: 0;
            width: 300px;
            max-width: 80vw;
            background: rgba(20, 24, 35, 0.95);
            backdrop-filter: blur(16px);
            border-left: 2px solid #3e5070;
            z-index: 210;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.6);
        }
        .player-panel.open {
            right: 0;
        }
        .player-panel-header {
            padding: 16px;
            border-bottom: 1px solid #2e3b50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: inherit;
            z-index: 1;
        }
        .player-panel-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #3e5070;
            background: transparent;
            color: #8ab8e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-stat-block {
            padding: 12px 16px;
            border-bottom: 1px solid #2e3b50;
        }
        .player-stat-block .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a8daa;
            margin-bottom: 2px;
        }
        .player-stat-block .stat-value {
            font-size: 1rem;
            font-weight: 600;
            color: #d0ddf0;
        }
        .player-items-section {
            padding: 12px 16px;
        }
        .player-items-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-item-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: #1a2535;
            border: 1px solid #2e3b50;
            color: #b8c8d8;
        }
        .player-item-tag.rare {
            border-color: #fbbf24;
            color: #fbbf24;
            animation: rare-glow 2s ease-in-out infinite;
        }
        @keyframes rare-glow {
            0%,
            100% {
                box-shadow: 0 0 4px rgba(251, 191, 36, 0.3);
            }
            50% {
                box-shadow: 0 0 14px rgba(251, 191, 36, 0.7);
            }
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.2s ease-out;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            width: 90%;
            max-width: 420px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 {
            color: var(--accent-glow);
            margin-bottom: 14px;
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
            font-family: var(--font-ui);
        }
        .modal textarea {
            min-height: 100px;
            resize: vertical;
        }
        .modal .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .modal button {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border-color: #555;
        }
        .btn-danger {
            background: transparent;
            color: #ff6b7a;
            border-color: #ff6b7a;
        }

        /* 世界选择面板 */
        .world-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.2s ease-out;
        }
        .world-panel-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 18px;
            width: 85%;
            max-width: 380px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .world-card {
            width: 90px;
            height: 100px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            font-size: 0.75rem;
            text-align: center;
        }
        .world-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(124, 111, 247, 0.4);
        }
        .world-card .world-emoji {
            font-size: 2rem;
        }
        .world-card-add {
            border-style: dashed;
            color: var(--text-secondary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 400;
            animation: toast-in 0.3s ease-out, toast-out 0.3s 2s ease-in forwards;
            border: 1px solid #444;
        }
        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toast-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .message-bubble {
                max-width: 92%;
                font-size: 0.85rem;
            }
            .option-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body class="">
    <div class="app-container">
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="world-selector" id="worldSelector">🌍 切换世界 ▾</div>
            <div class="top-bar-actions">
                <button class="btn-icon" id="btnSettings" title="设置">⚙️</button>
                <button class="btn-icon" id="btnNewChat" title="新故事">✨</button>
                <button class="btn-icon" id="btnExport" title="导出">📥</button>
            </div>
        </div>

        <!-- NPC状态栏 -->
        <div class="npc-bar" id="npcBar">
            <div class="npc-avatar-frame" id="npcAvatar">🧚</div>
            <div class="npc-info">
                <div class="npc-name" id="npcName">派蒙</div>
                <div class="npc-mood" id="npcMood">😊 兴奋期待中</div>
                <div class="affection-row">
                    <span>❤️</span>
                    <span class="affection-num" id="affectionNum">120</span>
                </div>
            </div>
        </div>

        <!-- 对话区 -->
        <div class="chat-container" id="chatContainer">
            <div style="text-align:center;color:var(--text-secondary);padding:40px 16px;font-size:0.9rem;">
                <div style="font-size:2.5rem;margin-bottom:8px;">✨</div>
                <p>欢迎，旅行者</p>
                <p style="font-size:0.75rem;">选择世界开始冒险吧</p>
            </div>
        </div>

        <!-- 选项区 -->
        <div class="options-container" id="optionsContainer">
            <span style="color:var(--text-secondary);font-size:0.8rem;">请先配置API Key</span>
        </div>
    </div>

    <!-- 主角面板按钮 -->
    <button class="player-panel-toggle" id="playerPanelToggle">🛡️</button>
    <div class="player-panel-overlay" id="playerPanelOverlay"></div>
    <div class="player-panel" id="playerPanel">
        <div class="player-panel-header">
            <h3>🛡️ 旅行者</h3>
            <button class="player-panel-close" id="playerPanelClose">✕</button>
        </div>
        <div id="playerStatsContainer"></div>
        <div class="player-items-section">
            <h4 style="color:#6a8daa;margin-bottom:8px;">🎒 次元背包</h4>
            <div class="player-items-list" id="playerItems"></div>
        </div>
        <div style="padding:12px 16px;">
            <button id="btnOpenJournal" style="width:100%;padding:10px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);">📜 旅途记忆</button>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="modal-overlay" id="settingsOverlay" style="display:none;">
        <div class="modal">
            <h3>⚙️ 设置</h3>
            <label>DeepSeek API Key</label>
            <input type="password" id="inputApiKey" placeholder="sk-...">
            <label>背景图片URL (可选)</label>
            <input type="text" id="inputBgUrl" placeholder="https://...">
            <input type="file" id="inputBgFile" accept="image/*" style="display:none;">
            <button id="btnUploadBg" style="margin-bottom:10px;">📁 上传背景图</button>
            <label>自定义世界 (JSON)</label>
            <textarea id="inputCustomWorlds" placeholder='[{"name":"绝区零","npc":"安比","prompt":"..."}]'></textarea>
            <div class="btn-row">
                <button class="btn-danger" id="btnResetAll">重置全部</button>
                <button class="btn-secondary" id="btnCloseSettings">取消</button>
                <button class="btn-primary" id="btnSaveSettings">保存</button>
            </div>
        </div>
    </div>

    <!-- 世界选择面板 -->
    <div class="world-panel" id="worldPanel" style="display:none;">
        <div class="world-panel-content" id="worldPanelContent"></div>
    </div>

    <!-- NPC角色卡面板 -->
    <div class="modal-overlay" id="npcCardOverlay" style="display:none;">
        <div class="modal" id="npcCardModal"></div>
    </div>

    <!-- 旅途记忆面板 -->
    <div class="modal-overlay" id="journalOverlay" style="display:none;">
        <div class="modal" id="journalModal"></div>
    </div>

    <!-- Toast容器 -->
    <div id="toastContainer"></div>

    <script>
        (function() {
            // ==================== DOM ====================
            const $chat = document.getElementById('chatContainer');
            const $options = document.getElementById('optionsContainer');
            const $npcBar = document.getElementById('npcBar');
            const $npcAvatar = document.getElementById('npcAvatar');
            const $npcName = document.getElementById('npcName');
            const $npcMood = document.getElementById('npcMood');
            const $affectionNum = document.getElementById('affectionNum');
            const $playerPanel = document.getElementById('playerPanel');
            const $playerOverlay = document.getElementById('playerPanelOverlay');
            const $playerToggle = document.getElementById('playerPanelToggle');
            const $playerClose = document.getElementById('playerPanelClose');
            const $playerStats = document.getElementById('playerStatsContainer');
            const $playerItems = document.getElementById('playerItems');
            const $worldSelector = document.getElementById('worldSelector');
            const $worldPanel = document.getElementById('worldPanel');
            const $worldContent = document.getElementById('worldPanelContent');
            const $settingsOverlay = document.getElementById('settingsOverlay');
            const $inputApiKey = document.getElementById('inputApiKey');
            const $inputBgUrl = document.getElementById('inputBgUrl');
            const $inputBgFile = document.getElementById('inputBgFile');
            const $inputCustomWorlds = document.getElementById('inputCustomWorlds');

            function addMessageBubble(role, text, animate = false) {
                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${role==='user'?'player':'npc'}`;
                const sender = role === 'user' ? getCurrentWorld().player.name : getCurrentWorld().npc.name;
                bubble.innerHTML = `<div class="sender-label">${sender}</div><div class="msg-content"></div>`;
                $chat.appendChild(bubble);
                const contentDiv = bubble.querySelector('.msg-content');
                if (animate && role === 'assistant') {
                    typewriterEffect(contentDiv, text, () => scrollToBottom());
                } else {
                    contentDiv.innerHTML = marked.parse(text);
                    scrollToBottom();
                }
                return bubble;
            }

            function typewriterEffect(el, text, cb) {
                el.textContent = '';
                el.parentElement.classList.add('typing-cursor');
                const chars = [...text];
                let i = 0;
                const speed = 20;

                function type() {
                    if (i < chars.length) {
                        el.textContent += chars[i];
                        i++;
                        scrollToBottom();
                        setTimeout(type, speed);
                    } else {
                        el.parentElement.classList.remove('typing-cursor');
                        el.innerHTML = marked.parse(text);
                        scrollToBottom();
                        if (cb) cb();
                    }
                }
                type();
            }

                    bindStartAndFree();
                    return;
                }
                // 从最后一条助手消息提取选项
                const lastAssistant = [...msgs].reverse().find(m => m.role === 'assistant');
                let opts = [];
                if (lastAssistant && lastAssistant.options) {
                    opts = lastAssistant.options;
                }
                if (opts.length === 0) opts = ['继续前进', '观察四周', '与同伴交谈'];
                $options.innerHTML = opts.map((o, i) =>

                document.getElementById('btnStart')?.addEventListener('click', () => {

            function bindFreeInput() {
                const input = document.getElementById('freeInput');
                const btn = document.getElementById('freeSend');
                if (!input || !btn) return;
                const send = () => {
                    const text = input.value.trim();
                    if (text && !state.isLoading) { input.value = '';

                };
                btn.addEventListener('click', send);
                input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                        send(); } });
            }

            // ==================== API调用与流式处理 ====================
            async function sendMessage(userText) {
                if (state.isLoading || !state.apiKey) return;
                state.isLoading = true;
                renderOptions();
                const msgs = getCurrentMessages();
                msgs.push({ role: 'user', content: userText });
                addMessageBubble('user', userText);
                showLoading();
                updateNPCBar(); // 显示情感反馈
                $npcMood.textContent = '💭 思考中...';
                scrollToBottom();
                saveState();

                const world = getCurrentWorld();
                const systemMsg = { role: 'system', content: world.systemPrompt };
                const apiMessages = [systemMsg, ...msgs];

                try {
                    const controller = new AbortController();
                    state.streamAborter = controller;
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + state.apiKey
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: apiMessages,
                            stream: true,
                            temperature: 0.8,
                            max_tokens: 1200
                        }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `HTTP ${response.status}`);
                    }

                    removeLoading();
                    const assistantBubble = addMessageBubble('assistant', '', true);
                    const contentDiv = assistantBubble.querySelector('.msg-content');
                    contentDiv.textContent = '';
                    assistantBubble.classList.add('typing-cursor');
                    let fullText = '';

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
                        for (const line of lines) {
                            const data = line.slice(6).trim();
                            if (data === '[DONE]') continue;
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices?.[0]?.delta?.content || '';
                                fullText += delta;
                                contentDiv.textContent = fullText;
                                scrollToBottom();
                            } catch (e) {}
                        }
                    }
                    assistantBubble.classList.remove('typing-cursor');
                    contentDiv.innerHTML = marked.parse(fullText);
                    scrollToBottom();

                    // 解析JSON
                    let parsed = parseAIResponse(fullText);
                    msgs.push({ role: 'assistant', content: parsed.npc_text, options: parsed.options });
                    // 状态更新
                    if (parsed.status_changes) applyStatusChanges(parsed.status_changes);
                    if (parsed.npc_mood) {
                        world.npc.mood = parsed.npc_mood;
                        $npcMood.textContent = parsed.npc_mood;
                    }
                    // 事件记录
                    if (parsed.event) {
                        const events = getCurrentEvents();
                        events.push({
                            text: parsed.event,
                            type: parsed.event_type || '普通',
                            time: new Date().toLocaleString()
                        });
                        if (!state.collectedNPCs.includes(world.npc.name)) {
                            state.collectedNPCs.push(world.npc.name);
                        }
                        saveState();
                    }
                    updateNPCBar();
                    updatePlayerPanel();
                    saveState();
                    state.isLoading = false;
                    renderOptions();
                } catch (err) {
                    removeLoading();
                    if (err.name === 'AbortError') {
                        showToast('已停止生成');
                    } else {
                        showToast('错误: ' + err.message);
                        $chat.innerHTML +=
                            `<div class="message-bubble npc" style="border-color:#f66;color:#faa;">⚠️ ${escapeHtml(err.message)}</div>`;
                    }
                    state.isLoading = false;
                    updateNPCBar();
                    renderOptions();
                    saveState();
                }
            }

            function parseAIResponse(text) {
                try {
                    const cleaned = text.trim();
                    let json = null;
                    try { json = JSON.parse(cleaned); } catch (e1) {
                        const match = cleaned.match(/```json\n?([\s\S]*?)\n?```/) || cleaned.match(/\{[\s\S]*\}/);
                        if (match) try { json = JSON.parse(match[1] || match[0]); } catch (e2) {}
                    }
                    if (json && json.npc_text) {
                        return {
                            npc_text: json.npc_text,
                            options: json.options || [],
                            status_changes: json.status_changes || {},
                            npc_mood: json.npc_mood || null,
                            event: json.event || null,
                            event_type: json.event_type || null
                        };
                    }
                } catch (e) {}
                return {
                    npc_text: text,
                    options: ['继续', '换个话题'],
                    status_changes: {},
                    npc_mood: null,
                    event: null
                };
            }

            function applyStatusChanges(changes) {
                const world = getCurrentWorld();
                if (changes.npc_affection) {
                    world.npc.affection = Math.max(0, Math.min(200, (world.npc.affection || 0) + changes
                        .npc_affection));
                }
                if (changes.items_gained) changes.items_gained.forEach(i => addItem(i));
                if (changes.items_lost) changes.items_lost.forEach(i => removeItem(i));
                if (changes.player_name) world.player.name = changes.player_name;
                updateNPCBar();
                updatePlayerPanel();
            }

            // ==================== 设置面板 ====================
            function openSettings() {
                $inputApiKey.value = state.apiKey;

            function closeSettings() { $settingsOverlay.style.display = 'none'; }

            function saveSettings() {
                state.apiKey = $inputApiKey.value.trim();
                state.bgUrl = $inputBgUrl.value.trim();
                try {
                    state.customWorlds = JSON.parse($inputCustomWorlds.value || '[]');
                } catch (e) { showToast('自定义世界JSON格式错误'); return; }
                applyBackground();
                saveState();
                closeSettings();
                updateAllUI();
                renderWorldPanel();
                showToast('设置已保存');
            }

            $btnUploadBg.addEventListener('click', () => $inputBgFile.click());
            $inputBgFile.addEventListener('change', () => {
                const file = $inputBgFile.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        $inputBgUrl.value = e.target.result;
                        state.bgUrl = e.target.result;
                        applyBackground();
                        saveState();
                    };
                    reader.readAsDataURL(file);
                }
            });

            // ==================== 旅途记忆面板 ====================
            function openJournal() {
                const events = getCurrentEvents();
                let html = '<h3>📜 旅途记忆</h3>';
                if (events.length === 0) html += '<p>暂无记录</p>';
                else html += events.map(e =>
                    `<div style="margin:6px 0;padding:6px;background:var(--bg);border-radius:8px;"><small>${e.time}</small> · ${e.text}</div>`
                    ).join('');
                html +=
                    '<hr><h4>🏆 成就</h4><div style="display:flex;flex-wrap:wrap;gap:8px;">' +
                    (state.achievements.length > 0 ? state.achievements.map(a =>
                        `<span style="background:var(--bg-tertiary);padding:4px 10px;border-radius:12px;">${a}</span>`
                        ).join('') : '暂无') + '</div>';
                html +=
                    '<hr><h4>📇 已邂逅NPC</h4><p>' + (state.collectedNPCs.join('、') || '暂无') + '</p>';
                $journalModal.innerHTML = html;
                $journalOverlay.style.display = 'flex';
            }

            // ==================== 全局事件 ====================
            function updateAllUI() {
                updateNPCBar();
                updatePlayerPanel();
                renderWorldPanel();
                renderOptions();
                renderChatHistory();
            }

            $worldSelector.addEventListener('click', () => {
                renderWorldPanel();
                $worldPanel.style.display = 'flex';
            });
            $worldPanel.addEventListener('click', e => { if (e.target === $worldPanel) $worldPanel.style.display =
                    'none'; });
            $npcBar.addEventListener('click', openNPCCard);
            $npcCardOverlay.addEventListener('click', e => { if (e.target === $npcCardOverlay) $npcCardOverlay.style
                    .display = 'none'; });
            $playerToggle.addEventListener('click', () => {
                $playerPanel.classList.add('open');
                $playerOverlay.classList.add('open');
            });
            $playerClose.addEventListener('click', () => {
                $playerPanel.classList.remove('open');
                $playerOverlay.classList.remove('open');
            });
            $playerOverlay.addEventListener('click', () => {
                $playerPanel.classList.remove('open');
                $playerOverlay.classList.remove('open');
            });
            $btnSettings.addEventListener('click', openSettings);
            $btnCloseSettings.addEventListener('click', closeSettings);
            $btnSaveSettings.addEventListener('click', saveSettings);
            $btnResetAll.addEventListener('click', () => { if (confirm('确定重置全部数据？')) resetAll(); });
            $btnNewChat.addEventListener('click', () => {
                if (getCurrentMessages().length > 0 && !confirm('清空当前世界对话？')) return;
                state.messages[state.currentWorldId] = [];
                state.events[state.currentWorldId] = [];
                getCurrentWorld().npc.affection = 50;
                updateAllUI();
                saveState();
            });
            $btnExport.addEventListener('click', () => {
                const msgs = getCurrentMessages();
                if (msgs.length === 0) return showToast('无对话可导出');
                let md = '# 多元宇宙对话记录\n\n';
                msgs.forEach(m => md += `**${m.role==='user'?getCurrentWorld().player.name:getCurrentWorld().npc.name}:** ${m.content}\n\n---\n`);
                const blob = new Blob([md], { type: 'text/markdown' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `chat_${state.currentWorldId}.md`;
                a.click();
            });
            $btnOpenJournal.addEventListener('click', openJournal);
            $journalOverlay.addEventListener('click', e => { if (e.target === $journalOverlay) $journalOverlay.style
                    .display = 'none'; });
            $settingsOverlay.addEventListener('click', e => { if (e.target === $settingsOverlay) closeSettings(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    $playerPanel.classList.remove('open');
                    $playerOverlay.classList.remove('open');
                    $worldPanel.style.display = 'none';
                    $npcCardOverlay.style.display = 'none';
                    $journalOverlay.style.display = 'none';
                    closeSettings();
                }
            });

            // 初始化
            loadState();
            updateAllUI();
            if (!state.apiKey) {
                $options.innerHTML = '<span style="color:var(--text-secondary);">请配置API Key (点击⚙️)</span>';
            }
        })();
    </script>
</body>
</html>
