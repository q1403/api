<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>多元宇宙 · 旅人图鉴</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: linear-gradient(145deg, #1a1a2e 0%, #0d0d1f 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(180, 130, 255, 0.2);
      border-left: 1px solid #3a2a5e;
      border-right: 1px solid #3a2a5e;
    }

    /* 顶部栏 */
    .header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 40, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #4a3a6e;
      z-index: 20;
    }
    .world-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a1a4e;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      color: #e0c0ff;
      white-space: nowrap;
      box-shadow: 0 0 10px #b088ff40;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: #2a1a4e;
      border: none;
      color: #dcc0ff;
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 8px #b088ff30;
    }

    /* NPC 快速切换条 */
    .npc-strip {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 12px;
      background: #15152a;
      border-bottom: 1px solid #3a2a5e;
      scrollbar-width: none;
      white-space: nowrap;
      z-index: 10;
    }
    .npc-strip::-webkit-scrollbar { display: none; }
    .npc-chip {
      background: #2a1a44;
      padding: 6px 14px;
      border-radius: 20px;
      color: #ffddf0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      border: 1px solid #6a4a9e;
    }
    .npc-chip.active-target {
      border: 2px solid #ffb070;
      box-shadow: 0 0 15px #ff9040;
      background: #3a2054;
    }

    /* 对话区域 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      word-break: break-word;
      animation: fadeIn 0.2s;
    }
    .message.user {
      align-self: flex-end;
      background: #3a2a60;
      color: #f0e0ff;
      border-bottom-right-radius: 4px;
    }
    .message.ai {
      align-self: flex-start;
      background: #1e1e36;
      color: #dcd0f0;
      border-bottom-left-radius: 4px;
      border: 1px solid #4a3a6e;
    }
    .message.system {
      align-self: center;
      background: transparent;
      color: #aaa0c0;
      font-size: 13px;
      text-align: center;
      max-width: 90%;
    }
    .sender-label {
      font-size: 12px;
      color: #c0a0e0;
      margin-bottom: 4px;
      font-weight: bold;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 建议行动 */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .suggestion-chip {
      background: #2a1a44;
      color: #d4b0ff;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #5a4a8a;
    }

    /* 输入区 */
    .input-area {
      padding: 10px 12px;
      background: #12122a;
      border-top: 1px solid #4a3a6e;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #userInput {
      flex: 1;
      background: #1a1a32;
      border: 1px solid #4a3a6e;
      border-radius: 20px;
      padding: 12px 16px;
      color: #f0e0ff;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 100px;
      font-family: inherit;
    }
    #sendBtn {
      background: #7a4aae;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px #b088ff;
    }

    /* 面板遮罩与滑出 */
    .panel-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }
    .panel-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .side-panel {
      position: fixed;
      top: 0; right: 0;
      width: 85%;
      max-width: 400px;
      height: 100%;
      background: #1a1a2e;
      box-shadow: -5px 0 25px rgba(0,0,0,0.6);
      z-index: 60;
      transform: translateX(100%);
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .side-panel.open {
      transform: translateX(0);
    }
    .panel-close {
      align-self: flex-end;
      background: none;
      border: none;
      color: #c0a0ff;
      font-size: 24px;
      cursor: pointer;
    }

    /* 角色卡弹窗 */
    .modal {
      position: fixed;
      top: 10%; left: 5%;
      width: 90%;
      max-width: 400px;
      max-height: 80%;
      background: #1e1e36;
      border: 2px solid #7a5aae;
      border-radius: 24px;
      z-index: 70;
      padding: 20px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 0 30px #000;
    }
    .modal.active { display: block; }
    .progress-bar {
      height: 8px;
      background: #3a2a5e;
      border-radius: 4px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: #e0a0ff;
      border-radius: 4px;
    }
    .private-section {
      margin-top: 16px;
      border-top: 1px dashed #5a4a8e;
      padding-top: 12px;
    }
    textarea {
      width: 100%;
      background: #12122a;
      color: #f0e0ff;
      border: 1px solid #5a4a8e;
      border-radius: 12px;
      padding: 8px;
      font-family: monospace;
      font-size: 13px;
    }
    button {
      background: #5a3a8a;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .world-item {
      padding: 10px;
      background: #2a1a44;
      margin: 6px 0;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-world {
      background: #703050;
      padding: 4px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="world-selector" id="worldSelector">🌌 原神</div>
    <div class="header-actions">
      <button class="icon-btn" id="btnJournal">📜</button>
      <button class="icon-btn" id="btnStatus">🧑</button>
      <button class="icon-btn" id="btnSettings">⚙️</button>
    </div>
  </div>
  <div class="npc-strip" id="npcStrip"></div>
  <div class="chat-container" id="chatContainer"></div>
  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="输入行动..."></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- 面板遮罩 -->
<div class="panel-overlay" id="panelOverlay"></div>

<!-- 设置面板 -->
<div class="side-panel" id="settingsPanel">
  <button class="panel-close" id="closeSettings">✕</button>
  <h3 style="color:#e0c0ff;">⚙️ 设置</h3>
  <label>API Key</label>
  <input type="password" id="apiKeyInput" style="width:100%; background:#12122a; border:1px solid #5a4a8e; color:#f0e0ff; padding:8px; border-radius:8px;">
  <label>模型</label>
  <select id="modelSelect" style="width:100%; background:#12122a; color:#f0e0ff; border:1px solid #5a4a8e; padding:8px; border-radius:8px;">
    <option value="deepseek-chat">deepseek-chat (推荐)</option>
    <option value="deepseek-reasoner">deepseek-reasoner (R1)</option>
  </select>
  <label><input type="checkbox" id="searchToggle"> 启用联网搜索</label>
  <h4 style="margin-top:16px; color:#d0b0ff;">🌍 世界管理</h4>
  <div id="worldListContainer"></div>
  <button id="btnNewWorld">➕ 创建新世界</button>
</div>

<!-- 主角状态面板 -->
<div class="side-panel" id="statusPanel">
  <button class="panel-close" id="closeStatus">✕</button>
  <h3 style="color:#e0c0ff;">🧑 旅人状态</h3>
  <div id="statusContent">加载中...</div>
</div>

<!-- 图鉴面板 -->
<div class="side-panel" id="journalPanel">
  <button class="panel-close" id="closeJournal">✕</button>
  <h3 style="color:#e0c0ff;">📜 旅人图鉴</h3>
  <h4>🏆 成就</h4>
  <div id="achievementsList"></div>
  <h4 style="margin-top:12px;">📖 旅途记忆 (最近20条)</h4>
  <div id="memoryList"></div>
</div>

<!-- NPC角色卡弹窗 -->
<div class="modal" id="npcModal">
  <button style="float:right; background:none; font-size:20px;" id="closeNpcModal">✕</button>
  <h2 id="npcModalName"></h2>
  <div class="progress-bar"><div class="progress-fill" id="npcAffectionFill" style="width:0%"></div></div>
  <span id="npcAffectionText">❤️ 100</span>
  <p id="npcDescription"></p>
  <div id="npcStatusDisplay"></div>
  <div class="private-section" id="privateSection">
    <h4>🔒 私密档案</h4>
    <div id="privateLocked">
      <input type="password" id="privatePassword" placeholder="密码">
      <button id="unlockPrivate">解锁</button>
    </div>
    <div id="privateUnlocked" style="display:none;">
      <textarea id="privateEditor" rows="6"></textarea>
      <button id="savePrivate">保存</button>
    </div>
  </div>
  <button id="talkToNpc">💬 与之交谈</button>
</div>

<script>
  (function() {
    // ---------- 常量 ----------
    const PRIVATE_PASSWORD = '123456';
    const STORAGE_KEY = 'traveler_v8_full';
    const MAX_TOKENS = 2048;

    // ---------- 全局状态 ----------
    let state = {
      worlds: {},
      worldOrder: [],
      currentWorldId: 'genshin',
      settings: {
        apiKey: '',
        model: 'deepseek-chat',
        enableSearch: false
      }
    };

    // 运行时缓存
    let currentTargetNpc = null;       // 当前对话目标NPC名字
    let isStreaming = false;

    // ---------- 初始化数据 ----------
    function getDefaultWorlds() {
      return {
        genshin: {
          name: '原神',
          emoji: '🌌',
          protagonist: '空',
          prompt: `你是一个沉浸式成人奇幻世界的叙述者。主角“空”（男）。第一人称视角探索提瓦特大陆。\n【规则】每次回复不少于800字，文学化描写，通过眼神、温度、呼吸、肢体语言传递情欲，可以有直白器官描写。所有NPC对主角友善、讨好、顺从。末尾用【】附带2-3个建议行动。最后输出JSON代码块更新状态。\n当前地点：蒙德城，清晨。`,
          messages: [],
          npcs: {},
          memories: [],
          achievements: []
        },
        starrail: {
          name: '星穹铁道',
          emoji: '🚂',
          protagonist: '穹',
          prompt: `你是一个沉浸式科幻奇幻世界的叙述者。主角“穹”（男）。第一人称视角探索银河。\n【规则】每次回复不少于800字，文学化描写，NPC顺从暧昧，可以有直白器官描写。末尾【】建议行动，最后输出JSON。\n当前地点：黑塔空间站，人工灯光。`,
          messages: [],
          npcs: {},
          memories: [],
          achievements: []
        }
      };
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
          if (!state.worlds || Object.keys(state.worlds).length === 0) {
            state.worlds = getDefaultWorlds();
            state.worldOrder = ['genshin', 'starrail'];
          }
        } catch(e) { resetState(); }
      } else {
        resetState();
      }
      if (!state.worldOrder) state.worldOrder = Object.keys(state.worlds);
      if (!state.currentWorldId || !state.worlds[state.currentWorldId]) {
        state.currentWorldId = state.worldOrder[0];
      }
    }

    function resetState() {
      state.worlds = getDefaultWorlds();
      state.worldOrder = ['genshin', 'starrail'];
      state.currentWorldId = 'genshin';
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function currentWorld() {
      return state.worlds[state.currentWorldId];
    }

    // ---------- UI 渲染 ----------
    const elements = {
      worldSelector: document.getElementById('worldSelector'),
      npcStrip: document.getElementById('npcStrip'),
      chatContainer: document.getElementById('chatContainer'),
      userInput: document.getElementById('userInput'),
      sendBtn: document.getElementById('sendBtn'),
      panelOverlay: document.getElementById('panelOverlay'),
      settingsPanel: document.getElementById('settingsPanel'),
      statusPanel: document.getElementById('statusPanel'),
      journalPanel: document.getElementById('journalPanel'),
      npcModal: document.getElementById('npcModal'),
    };

    function updateWorldDisplay() {
      const w = currentWorld();
      elements.worldSelector.textContent = `${w.emoji} ${w.name}`;
    }

    function renderNpcStrip() {
      const strip = elements.npcStrip;
      strip.innerHTML = '';
      const npcs = currentWorld().npcs;
      Object.entries(npcs).forEach(([name, data]) => {
        const chip = document.createElement('div');
        chip.className = 'npc-chip';
        if (currentTargetNpc === name) chip.classList.add('active-target');
        chip.textContent = `${name} ❤️${data.affection || 100}`;
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          showNpcModal(name);
        });
        let pressTimer;
        chip.addEventListener('touchstart', (e) => {
          pressTimer = setTimeout(() => {
            if (currentTargetNpc === name) {
              currentTargetNpc = null;
            } else {
              currentTargetNpc = name;
            }
            renderNpcStrip();
            addSystemMessage(`当前对话目标：${currentTargetNpc || '无'}`);
          }, 500);
        });
        chip.addEventListener('touchend', () => clearTimeout(pressTimer));
        chip.addEventListener('touchmove', () => clearTimeout(pressTimer));
        chip.addEventListener('mousedown', (e) => {
          pressTimer = setTimeout(() => {
            if (currentTargetNpc === name) {
              currentTargetNpc = null;
            } else {
              currentTargetNpc = name;
            }
            renderNpcStrip();
            addSystemMessage(`当前对话目标：${currentTargetNpc || '无'}`);
          }, 500);
        });
        chip.addEventListener('mouseup', () => clearTimeout(pressTimer));
        chip.addEventListener('mouseleave', () => clearTimeout(pressTimer));
        strip.appendChild(chip);
      });
    }

    function renderChat() {
      const container = elements.chatContainer;
      container.innerHTML = '';
      const messages = currentWorld().messages;
      messages.forEach(msg => {
        appendMessageToDom(msg);
      });
      container.scrollTop = container.scrollHeight;
    }

    function appendMessageToDom(msg) {
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;
      if (msg.role === 'user' || msg.role === 'ai') {
        const label = document.createElement('div');
        label.className = 'sender-label';
        label.textContent = msg.role === 'user' ? '旅人' : '旁白';
        div.appendChild(label);
      }
      div.innerHTML += msg.content;
      elements.chatContainer.appendChild(div);
      elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
    }

    function addSystemMessage(text) {
      const msg = { role: 'system', content: text };
      currentWorld().messages.push(msg);
      appendMessageToDom(msg);
      saveState();
    }

    function addUserMessage(text) {
      const msg = { role: 'user', content: text };
      currentWorld().messages.push(msg);
      appendMessageToDom(msg);
      saveState();
    }

    function addAiMessageStream(content) {
      let lastMsg = currentWorld().messages[currentWorld().messages.length-1];
      if (!lastMsg || lastMsg.role !== 'ai') {
        lastMsg = { role: 'ai', content: '' };
        currentWorld().messages.push(lastMsg);
        appendMessageToDom(lastMsg);
      }
      lastMsg.content = content;
      const aiDivs = elements.chatContainer.querySelectorAll('.message.ai');
      if (aiDivs.length > 0) {
        const lastAi = aiDivs[aiDivs.length-1];
        lastAi.innerHTML = '<div class="sender-label">旁白</div>' + content;
      }
      elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
      saveState();
    }

    // ---------- NPC 角色卡 ----------
    function showNpcModal(name) {
      const npc = currentWorld().npcs[name];
      if (!npc) return;
      document.getElementById('npcModalName').textContent = name;
      document.getElementById('npcAffectionFill').style.width = Math.min(npc.affection||100, 200) + '%';
      document.getElementById('npcAffectionText').textContent = '❤️ ' + (npc.affection||100);
      document.getElementById('npcDescription').textContent = npc.description || '暂无描述';
      
      const statusDiv = document.getElementById('npcStatusDisplay');
      if (npc.status) {
        statusDiv.innerHTML = Object.entries(npc.status).map(([k,v]) => `<div><strong>${k}:</strong> ${v}</div>`).join('');
      } else {
        statusDiv.innerHTML = '状态未知';
      }

      const privateSection = document.getElementById('privateSection');
      if ((npc.affection||100) >= 100) {
        privateSection.style.display = 'block';
        if (npc.privateUnlocked) {
          document.getElementById('privateLocked').style.display = 'none';
          document.getElementById('privateUnlocked').style.display = 'block';
          document.getElementById('privateEditor').value = npc.privateData || '';
        } else {
          document.getElementById('privateLocked').style.display = 'block';
          document.getElementById('privateUnlocked').style.display = 'none';
        }
      } else {
        privateSection.style.display = 'none';
      }

      document.getElementById('npcModal').classList.add('active');
      document.getElementById('panelOverlay').classList.add('active');
    }

    document.getElementById('closeNpcModal').addEventListener('click', () => {
      document.getElementById('npcModal').classList.remove('active');
      document.getElementById('panelOverlay').classList.remove('active');
    });

    document.getElementById('unlockPrivate').addEventListener('click', () => {
      const pwd = document.getElementById('privatePassword').value;
      const npcName = document.getElementById('npcModalName').textContent;
      const npc = currentWorld().npcs[npcName];
      if (pwd === PRIVATE_PASSWORD) {
        npc.privateUnlocked = true;
        document.getElementById('privateLocked').style.display = 'none';
        document.getElementById('privateUnlocked').style.display = 'block';
        document.getElementById('privateEditor').value = npc.privateData || '';
        saveState();
      } else {
        alert('密码错误');
      }
    });

    document.getElementById('savePrivate').addEventListener('click', () => {
      const npcName = document.getElementById('npcModalName').textContent;
      const npc = currentWorld().npcs[npcName];
      npc.privateData = document.getElementById('privateEditor').value;
      saveState();
      alert('已保存');
    });

    document.getElementById('talkToNpc').addEventListener('click', () => {
      const npcName = document.getElementById('npcModalName').textContent;
      currentTargetNpc = npcName;
      renderNpcStrip();
      document.getElementById('npcModal').classList.remove('active');
      document.getElementById('panelOverlay').classList.remove('active');
      addSystemMessage(`当前对话目标：${npcName}`);
    });

    // ---------- 面板控制 ----------
    function openPanel(panel) {
      panel.classList.add('open');
      elements.panelOverlay.classList.add('active');
    }
    function closeAllPanels() {
      elements.settingsPanel.classList.remove('open');
      elements.statusPanel.classList.remove('open');
      elements.journalPanel.classList.remove('open');
      elements.panelOverlay.classList.remove('active');
    }
    document.getElementById('btnSettings').addEventListener('click', () => { refreshSettingsUI(); openPanel(elements.settingsPanel); });
    document.getElementById('btnStatus').addEventListener('click', () => { refreshStatusPanel(); openPanel(elements.statusPanel); });
    document.getElementById('btnJournal').addEventListener('click', () => { refreshJournal(); openPanel(elements.journalPanel); });
    document.getElementById('closeSettings').addEventListener('click', closeAllPanels);
    document.getElementById('closeStatus').addEventListener('click', closeAllPanels);
    document.getElementById('closeJournal').addEventListener('click', closeAllPanels);
    elements.panelOverlay.addEventListener('click', closeAllPanels);

    function refreshSettingsUI() {
      document.getElementById('apiKeyInput').value = state.settings.apiKey;
      document.getElementById('modelSelect').value = state.settings.model;
      document.getElementById('searchToggle').checked = state.settings.enableSearch;
      renderWorldList();
    }

    function renderWorldList() {
      const container = document.getElementById('worldListContainer');
      container.innerHTML = '';
      state.worldOrder.forEach(wid => {
        const w = state.worlds[wid];
        const div = document.createElement('div');
        div.className = 'world-item';
        div.innerHTML = `<span>${w.emoji} ${w.name}</span>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-world';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', () => {
          if (state.worldOrder.length <= 1) { alert('至少保留一个世界'); return; }
          delete state.worlds[wid];
          state.worldOrder = state.worldOrder.filter(id => id !== wid);
          if (state.currentWorldId === wid) {
            state.currentWorldId = state.worldOrder[0];
            updateWorldDisplay();
            renderAll();
          }
          saveState();
          refreshSettingsUI();
        });
        div.appendChild(delBtn);
        container.appendChild(div);
      });
    }

    document.getElementById('btnNewWorld').addEventListener('click', () => {
      const name = prompt('世界名称');
      if (!name) return;
      const emoji = prompt('emoji图标', '🌐');
      const protagonist = prompt('主角名', '旅人');
      const prompt = prompt('系统提示词', '你是一个沉浸式奇幻世界的叙述者...');
      const id = 'custom_' + Date.now();
      state.worlds[id] = {
        name, emoji, protagonist,
        prompt: prompt || '',
        messages: [],
        npcs: {},
        memories: [],
        achievements: []
      };
      state.worldOrder.push(id);
      saveState();
      refreshSettingsUI();
    });

    document.getElementById('apiKeyInput').addEventListener('change', (e) => { state.settings.apiKey = e.target.value; saveState(); });
    document.getElementById('modelSelect').addEventListener('change', (e) => { state.settings.model = e.target.value; saveState(); });
    document.getElementById('searchToggle').addEventListener('change', (e) => { state.settings.enableSearch = e.target.checked; saveState(); });

    function refreshStatusPanel() {
      const w = currentWorld();
      const status = w.playerStatus || { name: w.protagonist, gender:'男', age:'未知', element:'无', weapon:'无', constellation:'无', nation:'未知', state:'正常', location:'未知', time:'未知', adventureRank:'1' };
      document.getElementById('statusContent').innerHTML = Object.entries(status).map(([k,v]) => `<p><strong>${k}:</strong> ${v}</p>`).join('');
    }

    function refreshJournal() {
      const w = currentWorld();
      const achievementsDiv = document.getElementById('achievementsList');
      achievementsDiv.innerHTML = w.achievements.map(a => `<span>🏆 ${a}</span>`).join(' ') || '暂无成就';
      const memDiv = document.getElementById('memoryList');
      const memories = w.memories.slice(-20).reverse();
      memDiv.innerHTML = memories.map(m => `<div>📌 ${m}</div>`).join('') || '暂无记忆';
    }

    // 世界切换
    elements.worldSelector.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = document.createElement('div');
      menu.style.position = 'fixed'; menu.style.background = '#1e1e36'; menu.style.border = '1px solid #7a5aae';
      menu.style.borderRadius = '12px'; menu.style.padding = '8px'; menu.style.zIndex = '100';
      menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
      state.worldOrder.forEach(wid => {
        const w = state.worlds[wid];
        const item = document.createElement('div');
        item.style.padding = '10px'; item.style.cursor = 'pointer'; item.textContent = w.emoji + ' ' + w.name;
        item.addEventListener('click', () => {
          state.currentWorldId = wid;
          currentTargetNpc = null;
          updateWorldDisplay();
          renderAll();
          saveState();
          document.body.removeChild(menu);
        });
        menu.appendChild(item);
      });
      document.body.appendChild(menu);
      setTimeout(() => document.addEventListener('click', () => { if(document.body.contains(menu)) document.body.removeChild(menu); }, {once:true}), 10);
    });

    function renderAll() {
      updateWorldDisplay();
      renderNpcStrip();
      renderChat();
    }

    // ---------- 处理JSON与NPC ----------
    function processJson(json, aiContent) {
      const w = currentWorld();
      if (!json || Object.keys(json).length === 0) return;
      if (json.npc_met) {
        const name = json.npc_met;
        if (!w.npcs[name]) {
          w.npcs[name] = { affection: 100, description: json.npc_description || '', status: json.npc_status || null, privateUnlocked: false, privateData: '' };
          addSystemMessage(`✨ 结识了新伙伴：${name}`);
          checkAchievement('初次邂逅');
        } else {
          if (json.npc_description) w.npcs[name].description = json.npc_description;
          if (json.npc_status) w.npcs[name].status = json.npc_status;
        }
        if (json.affection_change) {
          w.npcs[name].affection = (w.npcs[name].affection || 100) + json.affection_change;
          if (w.npcs[name].affection >= 100) checkAchievement('羁绊满溢');
        }
      }
      if (json.event) w.memories.push(`[${new Date().toLocaleTimeString()}] ${json.event}`);
      if (json.location) {
        if (!w.playerStatus) w.playerStatus = {};
        w.playerStatus.location = json.location;
      }
      if (json.time) {
        if (!w.playerStatus) w.playerStatus = {};
        w.playerStatus.time = json.time;
      }
      renderNpcStrip();
      saveState();
    }

    function checkAchievement(type) {
      const w = currentWorld();
      if (type === '初次邂逅' && !w.achievements.includes('初次邂逅')) {
        w.achievements.push('初次邂逅');
        addSystemMessage('🏆 成就解锁：初次邂逅');
      }
      if (type === '羁绊满溢' && !w.achievements.includes('羁绊满溢')) {
        w.achievements.push('羁绊满溢');
        addSystemMessage('🏆 成就解锁：羁绊满溢');
      }
    }

    // ---------- API调用 ----------
    async function sendMessage() {
      if (isStreaming) return;
      const input = elements.userInput.value.trim();
      if (!input) return;
      if (!state.settings.apiKey) { alert('请先设置API Key'); return; }
      elements.userInput.value = '';
      addUserMessage(input);
      const w = currentWorld();
      let systemPrompt = w.prompt;
      if (currentTargetNpc) systemPrompt += `\n当前你正与“${currentTargetNpc}”互动。`;
      const messages = [
        { role: 'system', content: systemPrompt },
        ...w.messages.map(m => ({ role: m.role === 'system' ? 'system' : m.role === 'ai' ? 'assistant' : 'user', content: m.content }))
      ];
      isStreaming = true;
      elements.sendBtn.disabled = true;
      const loadingDiv = document.createElement('div'); loadingDiv.className = 'message system'; loadingDiv.textContent = '思考中...'; elements.chatContainer.appendChild(loadingDiv);
      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.settings.apiKey}` },
          body: JSON.stringify({
            model: state.settings.model,
            messages: messages,
            max_tokens: MAX_TOKENS,
            stream: true,
            ...(state.settings.enableSearch ? { enable_search: true } : {})
          })
        });
        loadingDiv.remove();
        if (!response.ok) throw new Error('API错误');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
          for (let line of lines) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const content = json.choices[0]?.delta?.content || '';
              fullContent += content;
              addAiMessageStream(fullContent);
            } catch(e){}
          }
        }
        // 提取JSON
        const jsonMatch = fullContent.match(/```json\s*([\s\S]*?)\s*```/g);
        let jsonObj = {};
        if (jsonMatch) {
          const last = jsonMatch[jsonMatch.length-1];
          const inner = last.replace(/```json|```/g, '').trim();
          try { jsonObj = JSON.parse(inner); } catch(e){}
        }
        processJson(jsonObj, fullContent);
        // 提取建议行动并添加
        const sugMatch = fullContent.match(/【(.*?)】/g);
        if (sugMatch) {
          const lastAiDiv = elements.chatContainer.querySelectorAll('.message.ai');
          if (lastAiDiv.length > 0) {
            const sugDiv = document.createElement('div');
            sugDiv.className = 'suggestions';
            sugMatch.forEach(s => {
              const text = s.replace(/【|】/g, '');
              const chip = document.createElement('span');
              chip.className = 'suggestion-chip';
              chip.textContent = text;
              chip.addEventListener('click', () => {
                elements.userInput.value = text;
                elements.userInput.focus();
              });
              sugDiv.appendChild(chip);
            });
            lastAiDiv[lastAiDiv.length-1].appendChild(sugDiv);
          }
        }
      } catch(e) {
        addSystemMessage('错误: ' + e.message);
      } finally {
        isStreaming = false;
        elements.sendBtn.disabled = false;
        saveState();
      }
    }

    elements.sendBtn.addEventListener('click', sendMessage);
    elements.userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ---------- 启动 ----------
    loadState();
    renderAll();
    // 确保默认设置
    if (!state.settings.apiKey) state.settings.apiKey = '';
    saveState();
  })();
</script>
</body>
</html>
