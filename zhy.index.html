<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅人之星 · 多元宇宙</title>
    <style>
        :root {
            --bg: #0b0b12;
            --surface: #161625;
            --surface2: #1e1e32;
            --gold: #c9a96e;
            --gold2: #e4c580;
            --purple: #8b7cf0;
            --purple2: #a99df5;
            --text: #d2d2e0;
            --text2: #9d9db8;
            --text3: #67678a;
            --danger: #e0556a;
            --border: #2a2a40;
            --radius: 16px;
            --radius-sm: 10px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        #topBar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 20;
            flex-shrink: 0;
            position: relative;
        }
        #worldBtn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all .2s;
            user-select: none;
        }
        #worldBtn:active {
            background: #2e2e45;
            transform: scale(0.96);
        }
        #worldDropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            z-index: 55;
            min-width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        #worldDropdown.show {
            display: flex;
        }
        .wd-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background .15s;
            color: var(--text);
        }
        .wd-item:active,
        .wd-item:hover {
            background: var(--surface2);
            color: var(--gold);
        }
        .wd-item.active {
            color: var(--gold);
            font-weight: 700;
            background: #1f1f35;
        }
        #topIcons {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all .2s;
            flex-shrink: 0;
        }
        .icon-btn:active {
            transform: scale(0.9);
            background: #2e2e45;
        }
        #npcStrip {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            overflow-x: auto;
            flex-shrink: 0;
            background: #111119;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            align-items: center;
            min-height: 44px;
        }
        #npcStrip::-webkit-scrollbar {
            display: none;
        }
        .npc-chip {
            flex-shrink: 0;
            padding: 6px 13px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            white-space: nowrap;
            transition: all .2s;
            font-weight: 500;
            user-select: none;
        }
        .npc-chip.active-target {
            border-color: var(--gold) !important;
            color: var(--gold) !important;
            box-shadow: 0 0 12px rgba(201, 169, 110, 0.35);
            animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(201, 169, 110, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(201, 169, 110, 0.6);
            }
        }
        #noNpcHint {
            font-size: 11px;
            color: var(--text3);
            flex-shrink: 0;
        }
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
        }
        #chatArea::-webkit-scrollbar {
            width: 4px;
        }
        #chatArea::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeInUp .3s ease;
            white-space: pre-wrap;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-user {
            align-self: flex-end;
            background: var(--purple);
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg-assistant {
            align-self: flex-start;
            background: var(--surface2);
            color: var(--text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
        }
        .msg-system {
            align-self: center;
            font-size: 11px;
            color: var(--text3);
            text-align: center;
            padding: 6px 12px;
            font-style: italic;
        }
        .msg-image {
            align-self: center;
            max-width: 90%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeInUp .4s ease;
        }
        .msg-image img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        .msg-label {
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .msg-user .msg-label {
            text-align: right;
        }
        .suggest-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .suggest-chip {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 14px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: all .2s;
        }
        .suggest-chip:active {
            background: var(--surface2);
            border-color: var(--gold);
            color: var(--gold);
        }
        #inputArea {
            flex-shrink: 0;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #msgInput {
            flex: 1;
            resize: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: var(--font);
            max-height: 120px;
            min-height: 42px;
            outline: none;
            line-height: 1.4;
        }
        #msgInput:focus {
            border-color: var(--purple);
        }
        #sendBtn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--purple);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:active {
            transform: scale(0.9);
            background: #7a6ce0;
        }
        #sendBtn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #imgGenBtn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #imgGenBtn:active {
            transform: scale(0.9);
            background: #2e2e45;
        }
        .slide-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 88vw;
            max-width: 380px;
            height: 100dvh;
            background: var(--surface);
            z-index: 100;
            transition: right .3s cubic-bezier(.4, 0, .2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
            border-left: 1px solid var(--border);
        }
        .slide-panel.open {
            right: 0;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel-header h3 {
            font-size: 16px;
            color: var(--gold);
        }
        .panel-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .panel-body::-webkit-scrollbar {
            width: 3px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90vw;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            z-index: 5;
            line-height: 1;
        }
        .setting-row {
            margin-bottom: 14px;
        }
        .setting-row label {
            display: block;
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .setting-row input,
        .setting-row select,
        .setting-row textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
        }
        .setting-row input:focus,
        .setting-row select:focus,
        .setting-row textarea:focus {
            border-color: var(--purple);
        }
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toggle {
            width: 44px;
            height: 26px;
            border-radius: 13px;
            background: #444;
            cursor: pointer;
            position: relative;
            transition: background .3s;
            flex-shrink: 0;
        }
        .toggle.on {
            background: var(--purple);
        }
        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: left .3s;
        }
        .toggle.on::after {
            left: 21px;
        }
        .btn-sm {
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-weight: 600;
            transition: all .2s;
        }
        .btn-sm:active {
            transform: scale(0.94);
        }
        .btn-gold {
            background: var(--gold);
            color: #1a1a1a;
            border: none;
            font-weight: 700;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
        }
        .btn-sm:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .affection-bar {
            height: 8px;
            border-radius: 4px;
            background: #333;
            margin: 4px 0;
            overflow: hidden;
        }
        .affection-fill {
            height: 100%;
            background: linear-gradient(90deg, #e0556a, #ff8c9a);
            border-radius: 4px;
            transition: width .4s;
        }
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .thinking-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text3);
            animation: bounce 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) {
            animation-delay: .2s;
        }
        .thinking-dots span:nth-child(3) {
            animation-delay: .4s;
        }
        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: .4;
            }
            40% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        .pwd-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pwd-row input {
            flex: 1;
        }
        .pwd-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .world-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            gap: 8px;
        }
        .world-list-item span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .divider {
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }
        @media(min-width:768px) {
            .msg-bubble {
                max-width: 65%;
            }
            .slide-panel {
                width: 360px;
            }
        }
    </style>
</head>

            const DEFAULT_WORLDS = {
                genshin: { name: '原神', emoji: '🌍', protagonist: '空', prompt: BASE_PROMPT_GENSHIN, npcs: {},
                    messages: [] },
                starrail: { name: '星穹铁道', emoji: '🚂', protagonist: '穹', prompt: BASE_PROMPT_STARRAIL, npcs: {},
                    messages: [] },
                custom: { name: '自定义世界', emoji: '✨', protagonist: '旅人', prompt: BASE_PROMPT_CUSTOM, npcs: {},
                    messages: [] }
            };

            // ==================== 状态管理 ====================
            let appState = loadState();

            function getDefaultState() {
                const worlds = {};
                for (let [k, v] of Object.entries(DEFAULT_WORLDS)) {
                    worlds[k] = {
                        name: v.name,
                        emoji: v.emoji,
                        protagonist: v.protagonist,
                        prompt: v.prompt,
                        npcs: JSON.parse(JSON.stringify(v.npcs)),
                        messages: JSON.parse(JSON.stringify(v.messages))
                    };
                }
                return {
                    settings: { apiKey: '', model: 'deepseek-chat', enableSearch: false },
                    currentWorld: 'genshin',
                    worlds,
                    memories: { genshin: [], starrail: [], custom: [] },
                    achievements: [],
                    privateUnlocked: {},
                    privateData: {},
                    protagonistStatus: {
                        name: '空',
                        gender: '男',
                        age: '未知（外貌16-18）',
                        element: '无',
                        weapon: '无锋剑',
                        constellation: '旅人座',
                        nation: '无（旅行者）',
                        condition: '健康，力量封印中',
                        location: '蒙德 · 坠星山谷 · 星落湖',
                        time: '清晨，阳光明媚',
                        adventureRank: ''
                    }
                };
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const saved = JSON.parse(raw);
                        const def = getDefaultState();
                        // 合并默认世界结构
                        for (let wk of Object.keys(def.worlds)) {
                            if (!saved.worlds[wk]) saved.worlds[wk] = def.worlds[wk];
                            if (!saved.worlds[wk].npcs) saved.worlds[wk].npcs = {};
                            if (!saved.worlds[wk].messages) saved.worlds[wk].messages = [];
                        }
                        if (!saved.memories) saved.memories = { genshin: [], starrail: [], custom: [] };
                        if (!saved.achievements) saved.achievements = [];
                        if (!saved.privateUnlocked) saved.privateUnlocked = {};
                        if (!saved.privateData) saved.privateData = {};
                        if (!saved.protagonistStatus) saved.protagonistStatus = def.protagonistStatus;
                        if (!saved.settings) saved.settings = def.settings;
                        // 确保所有世界的memories key存在
                        for (let wk of Object.keys(saved.worlds)) {
                            if (!saved.memories[wk]) saved.memories[wk] = [];
                        }
                        return saved;
                    }
                } catch (e) {}
                return getDefaultState();
            }

            function saveState() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
            }

            function getCurrentWorld() { return appState.worlds[appState.currentWorld]; }

            function getWorldKey() { return appState.currentWorld; }

            // ==================== DOM工具 ====================
            const $ = (s) => document.querySelector(s);
            const chatArea = $('#chatArea');
            const msgInput = $('#msgInput');
            const sendBtn = $('#sendBtn');
            const imgGenBtn = $('#imgGenBtn');
            const worldBtn = $('#worldBtn');
            const worldDropdown = $('#worldDropdown');
            const npcStrip = $('#npcStrip');
            const overlay = $('#overlay');

            let currentTargetNpc = null;
            let isStreaming = false;

            // ==================== 渲染函数 ====================
            function renderAll() {
                updateWorldBtn();
                renderWorldDropdown();
                renderNpcStrip();
                renderChat();
                renderStatusPanel();
                renderArchivePanel();
                renderSettingsPanel();
            }

            function updateWorldBtn() {
                const w = getCurrentWorld();
                worldBtn.textContent = `${w.emoji} ${w.name} ▾`;
            }

            function renderWorldDropdown() {
                worldDropdown.innerHTML = '';
                Object.entries(appState.worlds).forEach(([key, w]) => {
                    const div = document.createElement('div');
                    div.className = 'wd-item' + (key === appState.currentWorld ? ' active' : '');
                    div.textContent = `${w.emoji} ${w.name}`;
                    div.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        if (key !== appState.currentWorld && !isStreaming) {
                            switchWorld(key);
                        }
                        worldDropdown.classList.remove('show');
                    });
                    worldDropdown.appendChild(div);
                });
            }

            function switchWorld(key) {
                if (key === appState.currentWorld) return;
                appState.currentWorld = key;
                const w = getCurrentWorld();
                appState.protagonistStatus.name = w.protagonist;
                currentTargetNpc = null;
                saveState();
                renderAll();
                addSystemMsg(`已切换至 ${w.emoji} ${w.name}`);
            }

            function renderNpcStrip() {
                const npcs = getCurrentWorld().npcs;
                const keys = Object.keys(npcs);
                npcStrip.innerHTML = '';
                if (keys.length === 0) {
                    npcStrip.innerHTML = '<span id="noNpcHint">尚未结识任何NPC</span>';
                } else {
                    keys.forEach(name => {
                        const npc = npcs[name];
                        const chip = document.createElement('span');
                        chip.className = 'npc-chip' + (currentTargetNpc === name ? ' active-target' :
                            '');
                        chip.textContent = `${name} ❤️${npc.affection||100}`;
                        // 单击查看角色卡
                        chip.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showNpcModal(name);
                        });
                        // 长按设为对话目标
                        let pressTimer;
                        chip.addEventListener('pointerdown', (e) => {
                            pressTimer = setTimeout(() => {
                                currentTargetNpc = (currentTargetNpc === name) ? null : name;
                                addSystemMsg(currentTargetNpc ? `🎯 对话目标：${name}` : `已取消对话目标`);
                                renderNpcStrip();
                                saveState();
                            }, 500);
                        });
                        chip.addEventListener('pointerup', () => clearTimeout(pressTimer));
                        chip.addEventListener('pointerleave', () => clearTimeout(pressTimer));
                        chip.addEventListener('pointercancel', () => clearTimeout(pressTimer));
                        npcStrip.appendChild(chip);
                    });
                }
            }

            function renderChat() {
                chatArea.innerHTML = '';
                getCurrentWorld().messages.forEach(m => appendMessageToDOM(m));
                scrollChatBottom();
            }

            function appendMessageToDOM(msg) {
    const div = document.createElement('div');
    if (msg.role === 'system') {
        div.className = 'msg-system';
        div.textContent = msg.content;
    } else if (msg.role === 'image') {
        div.className = 'msg-image';
        div.style.position = 'relative';
        div.style.minHeight = '200px';
        div.style.background = '#1a1a2e';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.justifyContent = 'center';
        
        // 加载占位符
        const placeholder = document.createElement('div');
        placeholder.textContent = '🖼️ 图片加载中...';
        placeholder.style.color = 'var(--text3)';
        placeholder.style.fontSize = '14px';
        div.appendChild(placeholder);

        const img = document.createElement('img');
        img.src = msg.content;
        img.alt = '生成图片';
        img.loading = 'lazy';
        img.style.width = '100%';
        img.style.display = 'none';
        img.style.borderRadius = '12px';
        img.style.cursor = 'pointer';
        
        img.onload = () => {
            placeholder.remove();
            img.style.display = 'block';
            div.style.background = 'transparent';
            div.style.minHeight = 'auto';
            // 添加点击放大
            img.addEventListener('click', () => window.open(msg.content, '_blank'));
        };
        
        img.onerror = () => {
            placeholder.innerHTML = '⚠️ 图片加载失败<br><small style="font-size:10px;">点击此处尝试打开原图</small>';
            placeholder.style.cursor = 'pointer';
            placeholder.addEventListener('click', () => window.open(msg.content, '_blank'));
            div.style.background = '#1a1a2e';
            div.style.minHeight = '80px';
        };
        
        div.appendChild(img);
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:10px;color:var(--text3);text-align:center;margin-top:4px;';
        label.textContent = '🖼️ AI生成插画（点击放大）';
        div.appendChild(label);
    } else if (msg.role === 'user') {
        div.className = 'msg-bubble msg-user';
        div.innerHTML = `<div class="msg-label">🧑 ${escapeHtml(appState.protagonistStatus.name)}</div>${escapeHtml(msg.content)}`;
    } else if (msg.role === 'assistant') {
        div.className = 'msg-bubble msg-assistant';
        let cleaned = msg.content.replace(/```json[\s\S]*?```/g, '').replace(/【[^】]*】/g, '').trim();
        div.innerHTML = `<div class="msg-label">📖 旁白</div>${escapeHtml(cleaned).replace(/\n/g, '<br>')}`;
        const suggests = extractSuggests(msg.content);
        if (suggests.length) {
            const chipDiv = document.createElement('div');
            chipDiv.className = 'suggest-chips';
            suggests.forEach(s => {
                const chip = document.createElement('span');
                chip.className = 'suggest-chip';
                chip.textContent = s;
                chip.addEventListener('click', () => {
                    msgInput.value = s;
                    msgInput.focus();
                    msgInput.dispatchEvent(new Event('input'));
                });
                chipDiv.appendChild(chip);
            });
            div.appendChild(chipDiv);
        }
    }
    chatArea.appendChild(div);
    scrollChatBottom();
}
