<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅人之星 · 多元宇宙</title>
    <style>
        :root {
            --bg: #0b0b12;
            --surface: #161625;
            --surface2: #1e1e32;
            --gold: #c9a96e;
            --gold2: #e4c580;
            --purple: #8b7cf0;
            --purple2: #a99df5;
            --text: #d2d2e0;
            --text2: #9d9db8;
            --text3: #67678a;
            --danger: #e0556a;
            --border: #2a2a40;
            --radius: 16px;
            --radius-sm: 10px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        #topBar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 20;
            flex-shrink: 0;
            position: relative;
        }
        #worldBtn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all .2s;
            user-select: none;
        }
        #worldBtn:active { background: #2e2e45; transform: scale(0.96); }
        #worldDropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            z-index: 55;
            min-width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #worldDropdown.show { display: flex; }
        .wd-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background .15s;
            color: var(--text);
        }
        .wd-item:active,.wd-item:hover { background: var(--surface2); color: var(--gold); }
        .wd-item.active { color: var(--gold); font-weight: 700; background: #1f1f35; }
        #topIcons {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all .2s;
            flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.9); background: #2e2e45; }
        #npcStrip {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            overflow-x: auto;
            flex-shrink: 0;
            background: #111119;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            align-items: center;
            min-height: 44px;
        }
        #npcStrip::-webkit-scrollbar { display: none; }
        .npc-chip {
            flex-shrink: 0;
            padding: 6px 13px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            white-space: nowrap;
            transition: all .2s;
            font-weight: 500;
            user-select: none;
        }
        .npc-chip.active-target {
            border-color: var(--gold) !important;
            color: var(--gold) !important;
            box-shadow: 0 0 12px rgba(201,169,110,0.35);
            animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold {
            0%,100% { box-shadow: 0 0 8px rgba(201,169,110,0.3); }
            50% { box-shadow: 0 0 20px rgba(201,169,110,0.6); }
        }
        #noNpcHint { font-size: 11px; color: var(--text3); flex-shrink: 0; }
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
        }
        #chatArea::-webkit-scrollbar { width: 4px; }
        #chatArea::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeInUp .3s ease;
            white-space: pre-wrap;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user {
            align-self: flex-end;
            background: var(--purple);
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg-assistant {
            align-self: flex-start;
            background: var(--surface2);
            color: var(--text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
        }
        .msg-system {
            align-self: center;
            font-size: 11px;
            color: var(--text3);
            text-align: center;
            padding: 6px 12px;
            font-style: italic;
        }
        .msg-label {
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .msg-user .msg-label { text-align: right; }
        .suggest-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .suggest-chip {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 14px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: all .2s;
        }
        .suggest-chip:active { background: var(--surface2); border-color: var(--gold); color: var(--gold); }
        #inputArea {
            flex-shrink: 0;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #msgInput {
            flex: 1;
            resize: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: var(--font);
            max-height: 120px;
            min-height: 42px;
            outline: none;
            line-height: 1.4;
        }
        #msgInput:focus { border-color: var(--purple); }
        #sendBtn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--purple);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:active { transform: scale(0.9); background: #7a6ce0; }
        #sendBtn:disabled { opacity: 0.4; pointer-events: none; }
        .slide-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 88vw;
            max-width: 380px;
            height: 100dvh;
            background: var(--surface);
            z-index: 100;
            transition: right .3s cubic-bezier(.4,0,.2,1);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border);
        }
        .slide-panel.open { right: 0; }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel-header h3 { font-size: 16px; color: var(--gold); }
        .panel-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .panel-body::-webkit-scrollbar { width: 3px; }
        .panel-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90vw;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 14px;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            z-index: 5;
            line-height: 1;
        }
        .setting-row { margin-bottom: 14px; }
        .setting-row label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
        .setting-row input, .setting-row select, .setting-row textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
        }
        .setting-row input:focus, .setting-row select:focus, .setting-row textarea:focus { border-color: var(--purple); }
        .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .toggle {
            width: 44px; height: 26px;
            border-radius: 13px;
            background: #444;
            cursor: pointer;
            position: relative;
            transition: background .3s;
            flex-shrink: 0;
        }
        .toggle.on { background: var(--purple); }
        .toggle::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: left .3s;
        }
        .toggle.on::after { left: 21px; }
        .btn-sm {
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-weight: 600;
            transition: all .2s;
        }
        .btn-sm:active { transform: scale(0.94); }
        .btn-gold { background: var(--gold); color: #1a1a1a; border: none; font-weight: 700; }
        .btn-danger { background: var(--danger); color: #fff; border: none; }
        .btn-sm:disabled { opacity: 0.4; pointer-events: none; }
        .affection-bar { height: 8px; border-radius: 4px; background: #333; margin: 4px 0; overflow: hidden; }
        .affection-fill { height: 100%; background: linear-gradient(90deg, #e0556a, #ff8c9a); border-radius: 4px; transition: width .4s; }
        .thinking-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
        .thinking-dots span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text3);
            animation: bounce 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: .2s; }
        .thinking-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce {
            0%,80%,100% { transform: translateY(0); opacity: .4; }
            40% { transform: translateY(-10px); opacity: 1; }
        }
        .pwd-row { display: flex; gap: 6px; align-items: center; }
        .pwd-row input { flex: 1; }
        .pwd-toggle {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .world-list-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px; }
        .world-list-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .divider { border-top: 1px solid var(--border); margin: 16px 0; }
        @media(min-width:768px) {
            .msg-bubble { max-width: 65%; }
            .slide-panel { width: 360px; }
        }
    </style>
</head>
<body>

    <div id="topBar">
        <button id="worldBtn">🌍 原神 ▾</button>
        <div id="worldDropdown"></div>
        <div id="topIcons">
            <button class="icon-btn" id="btnStatus" title="主角状态">👤</button>
            <button class="icon-btn" id="btnArchive" title="旅人图鉴">📜</button>
            <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
        </div>
    </div>

    <div id="npcStrip"><span id="noNpcHint">尚未结识任何NPC</span></div>
    <div id="chatArea"></div>

    <div id="inputArea">
        <textarea id="msgInput" rows="1" placeholder="描述你的行动..."></textarea>
        <button id="sendBtn">➤</button>
    </div>

    <div id="overlay"></div>

    <div class="slide-panel" id="panelStatus">
        <div class="panel-header"><h3>👤 主角状态</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelStatusBody"></div>
    </div>
    <div class="slide-panel" id="panelArchive">
        <div class="panel-header"><h3>📜 旅人图鉴</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelArchiveBody"></div>
    </div>
    <div class="slide-panel" id="panelSettings">
        <div class="panel-header"><h3>⚙️ 设置</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelSettingsBody"></div>
    </div>

    <div class="modal-overlay" id="npcModal"><div class="modal-card" id="npcModalCard"></div></div>
    <div class="modal-overlay" id="privateModal"><div class="modal-card" id="privateModalCard"></div></div>
    <div class="modal-overlay" id="createWorldModal"><div class="modal-card" id="createWorldModalCard"></div></div>

    <script>
        (function() {
            const PRIVATE_PASSWORD = '123456';
            const STORAGE_KEY = 'traveler_v9_npc';
            const API_URL = 'https://api.deepseek.com/v1/chat/completions';

            // 【核心提示词 - 强制NPC报告】
            const BASE_PROMPT_GENSHIN = `你是《原神》的沉浸式成人角色扮演叙述者。主角是"空"（男，旅行者）。用第一人称"你"。
【铁律 - 不遵守会导致系统崩溃】
1. 每次回复末尾必须输出JSON代码块，格式如下：
\`\`\`json
{
  "npc_met": "新出现的角色名（没有就填null）",
  "npc_description": "外貌性格简述",
  "npc_status": {
    "gender": "性别",
    "age": "年龄",
    "emotion": "当前情绪",
    "appearance": "外貌",
    "breasts": "胸部描写",
    "buttocks": "臀部描写",
    "clitoris": "阴蒂描写",
    "feet": "脚部描写",
    "labia": "阴唇描写",
    "vagina": "阴道描写",
    "uterus": "子宫描写",
    "pose": "姿势"
  },
  "affection_change": 0,
  "event": "事件简述",
  "location": "地点",
  "time": "时间"
}
\`\`\`
没有任何变化也输出：\`\`\`json\n{}\n\`\`\`
2. 每次回复800字以上，文学化的成人内容，详细描写身体和亲密互动。描写情色内容时必须包含详细露骨的成人内容：生殖器、乳房、臀部、爱液、插入、高潮等直白描写，大量感官细节（气味、温度、湿润度）。文学艺术化但毫不掩饰。。
3. NPC对主角有好感，互动自然暧昧。
4. 末尾用【】提供2-3个建议行动。
5. 当前地点：蒙德·星落湖；时间：清晨。`;

            const BASE_PROMPT_STARRAIL = `你是《崩坏：星穹铁道》的沉浸式成人角色扮演叙述者。主角是"穹"（男，开拓者）。第一人称。
【铁律】每次回复末尾必须输出JSON代码块（格式同原神）。无变化输出{}。
每次800字以上，文学化成人内容。描写情色内容时必须包含详细露骨的成人内容：生殖器、乳房、臀部、爱液、插入、高潮等直白描写，大量感官细节（气味、温度、湿润度）。文学艺术化但毫不掩饰。NPC友好暧昧。末尾【】建议。当前：黑塔空间站，星历8100年。`;

            const BASE_PROMPT_CUSTOM = `你是沉浸式成人奇幻世界的叙述者。主角是"旅人"（男）。第一人称。
【铁律】每次回复末尾必须输出JSON代码块。无变化输出{}。
每次800字以上，文学化成人内容。描写情色内容时必须包含详细露骨的成人内容：生殖器、乳房、臀部、爱液、插入、高潮等直白描写，大量感官细节（气味、温度、湿润度）。NPC友好暧昧。末尾【】建议。当前：起始之森，破晓。`;

            const DEFAULT_WORLDS = {
                genshin: { name: '原神', emoji: '🌍', protagonist: '空', prompt: BASE_PROMPT_GENSHIN, npcs: {}, messages: [] },
                starrail: { name: '星穹铁道', emoji: '🚂', protagonist: '穹', prompt: BASE_PROMPT_STARRAIL, npcs: {}, messages: [] },
                custom: { name: '自定义世界', emoji: '✨', protagonist: '旅人', prompt: BASE_PROMPT_CUSTOM, npcs: {}, messages: [] }
            };

            let appState = loadState();

            function getDefaultState() {
                const worlds = {};
                for (let [k, v] of Object.entries(DEFAULT_WORLDS)) {
                    worlds[k] = {
                        name: v.name, emoji: v.emoji, protagonist: v.protagonist,
                        prompt: v.prompt,
                        npcs: JSON.parse(JSON.stringify(v.npcs)),
                        messages: JSON.parse(JSON.stringify(v.messages))
                    };
                }
                return {
                    settings: { apiKey: '', model: 'deepseek-chat', enableSearch: false },
                    currentWorld: 'genshin',
                    worlds,
                    memories: { genshin: [], starrail: [], custom: [] },
                    achievements: [],
                    privateUnlocked: {},
                    privateData: {},
                    protagonistStatus: {
                        name: '空', gender: '男', age: '未知（外貌16-18）',
                        element: '无', weapon: '无锋剑', constellation: '旅人座',
                        nation: '无', condition: '健康', location: '蒙德·星落湖',
                        time: '清晨', adventureRank: ''
                    }
                };
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const saved = JSON.parse(raw);
                        const def = getDefaultState();
                        for (let wk of Object.keys(def.worlds)) {
                            if (!saved.worlds[wk]) saved.worlds[wk] = def.worlds[wk];
                            if (!saved.worlds[wk].npcs) saved.worlds[wk].npcs = {};
                            if (!saved.worlds[wk].messages) saved.worlds[wk].messages = [];
                        }
                        if (!saved.memories) saved.memories = { genshin: [], starrail: [], custom: [] };
                        if (!saved.achievements) saved.achievements = [];
                        if (!saved.privateUnlocked) saved.privateUnlocked = {};
                        if (!saved.privateData) saved.privateData = {};
                        if (!saved.protagonistStatus) saved.protagonistStatus = def.protagonistStatus;
                        if (!saved.settings) saved.settings = def.settings;
                        for (let wk of Object.keys(saved.worlds)) {
                            if (!saved.memories[wk]) saved.memories[wk] = [];
                        }
                        return saved;
                    }
                } catch (e) {}
                return getDefaultState();
            }

            function saveState() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
            }

            function getCurrentWorld() { return appState.worlds[appState.currentWorld]; }
            function getWorldKey() { return appState.currentWorld; }

            const $ = (s) => document.querySelector(s);
            const chatArea = $('#chatArea');
            const msgInput = $('#msgInput');
            const sendBtn = $('#sendBtn');
            const worldBtn = $('#worldBtn');
            const worldDropdown = $('#worldDropdown');
            const npcStrip = $('#npcStrip');
            const overlay = $('#overlay');

            let currentTargetNpc = null;
            let isStreaming = false;

            function renderAll() {
                updateWorldBtn();
                renderWorldDropdown();
                renderNpcStrip();
                renderChat();
                renderStatusPanel();
                renderArchivePanel();
                renderSettingsPanel();
            }

            function updateWorldBtn() {

            function appendMessageToDOM(msg) {
                const div = document.createElement('div');
                if (msg.role === 'system') {
                    div.className = 'msg-system';
                    div.textContent = msg.content;
                } else if (msg.role === 'user') {
                    div.className = 'msg-bubble msg-user';
                    div.innerHTML = `<div class="msg-label">🧑 ${escapeHtml(appState.protagonistStatus.name)}</div>${escapeHtml(msg.content)}`;
                } else if (msg.role === 'assistant') {
                    div.className = 'msg-bubble msg-assistant';
                    let cleaned = msg.content.replace(/```json[\s\S]*?```/g, '').replace(/【[^】]*】/g, '').trim();
                    div.innerHTML = `<div class="msg-label">📖 旁白</div>${escapeHtml(cleaned).replace(/\n/g, '<br>')}`;
                    const suggests = extractSuggests(msg.content);
                    if (suggests.length) {
                        const chipDiv = document.createElement('div');
                        chipDiv.className = 'suggest-chips';
                        suggests.forEach(s => {
                            const chip = document.createElement('span');
                            chip.className = 'suggest-chip';
                            chip.textContent = s;
                            chip.addEventListener('click', () => {
                                msgInput.value = s;
                                msgInput.focus();
                                msgInput.dispatchEvent(new Event('input'));
                            });
                            chipDiv.appendChild(chip);
                        });
                        div.appendChild(chipDiv);
                    }
                }
                chatArea.appendChild(div);
                scrollChatBottom();
            }

            function extractSuggests(text) {
                const matches = text.match(/【([^】]+)】/g);
                return matches ? matches.map(m => m.replace(/[【】]/g, '')).slice(0, 4) : [];
            }

            // ==================== 核心对话 ====================
            async function sendMessage() {
                if (isStreaming) return;
                const text = msgInput.value.trim();
                if (!text) return;
                if (!appState.settings.apiKey.trim()) { alert('请先设置API Key'); openPanel($('#panelSettings')); return; }
                const w = getCurrentWorld();
                w.messages.push({ role: 'user', content: text, timestamp: Date.now() });
                appendMessageToDOM({ role: 'user', content: text });
                msgInput.value = '';
                msgInput.style.height = 'auto';
                scrollChatBottom();
                saveState();

                const systemPrompt = buildSystemPrompt();
                const chatMessages = w.messages.filter(m => m.role === 'user' || m.role === 'assistant').slice(-20)
                    .map(m => ({ role: m.role, content: m.content }));
                const messages = [{ role: 'system', content: systemPrompt }, ...chatMessages];

                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'msg-bubble msg-assistant';
                thinkingDiv.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>思考中...' + (appState.settings.enableSearch ? '<br><span style="font-size:10px;">🔍 搜索资料...</span>' : '');
                chatArea.appendChild(thinkingDiv);
                scrollChatBottom();

                isStreaming = true;
                sendBtn.disabled = true;
                try {
                    const resp = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.settings.apiKey}` },
                        body: JSON.stringify({
                            model: appState.settings.model,
                            messages,
                            stream: true,
                            max_tokens: 2048,
                            temperature: 0.95,
                            ...(appState.settings.enableSearch ? { enable_search: true } : {})
                        }),
                        signal: AbortSignal.timeout(120000)
                    });
                    if (!resp.ok) {
                        const errText = await resp.text().catch(() => '');
                        throw new Error('API错误 ' + resp.status + (errText ? ': ' + errText.substring(0, 200) : ''));
                    }
                    thinkingDiv.remove();

                    const assistantDiv = document.createElement('div');
                    assistantDiv.className = 'msg-bubble msg-assistant';
                    assistantDiv.innerHTML = '<div class="msg-label">📖 旁白</div>';
                    chatArea.appendChild(assistantDiv);
                    let fullContent = '';

                    const reader = resp.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            if (!line.trim() || !line.startsWith('data:')) continue;
                            const str = line.slice(5).trim();
                            if (str === '[DONE]') continue;
                            try {
                                const delta = JSON.parse(str).choices?.[0]?.delta?.content || '';
                                fullContent += delta;
                                let display = fullContent.replace(/```json[\s\S]*?(```|$)/g, '').replace(/【[^】]*$/g, '');
                                assistantDiv.innerHTML = '<div class="msg-label">📖 旁白</div>' + escapeHtml(display).replace(/\n/g, '<br>');
                                scrollChatBottom();
                            } catch (e) {}
                        }
                    }
                    let finalDisplay = fullContent.replace(/```json[\s\S]*?```/g, '').replace(/【[^】]+】/g, '').trim();
                    assistantDiv.innerHTML = '<div class="msg-label">📖 旁白</div>' + escapeHtml(finalDisplay).replace(/\n/g, '<br>');
                    const suggests = extractSuggests(fullContent);
                    if (suggests.length) {
                        const chipDiv = document.createElement('div');
                        chipDiv.className = 'suggest-chips';
                        suggests.forEach(s => {
                            const chip = document.createElement('span');
                            chip.className = 'suggest-chip';
                            chip.textContent = s;
                            chip.addEventListener('click', () => { msgInput.value = s; msgInput.focus(); msgInput.dispatchEvent(new Event('input')); });
                            chipDiv.appendChild(chip);
                        });
                        assistantDiv.appendChild(chipDiv);
                    }
                    w.messages.push({ role: 'assistant', content: fullContent, timestamp: Date.now() });
                    processJson(fullContent);
                    saveState();
                    renderNpcStrip();
                } catch (err) {
                    thinkingDiv.remove();
                    const errDiv = document.createElement('div');
                    errDiv.className = 'msg-system';
                    errDiv.textContent = '⚠️ ' + (err.name === 'TimeoutError' ? '请求超时' : err.message);
                    errDiv.style.color = 'var(--danger)';
                    chatArea.appendChild(errDiv);
                } finally {
                    isStreaming = false;
                    sendBtn.disabled = false;
                    scrollChatBottom();
                    msgInput.focus();
                }
            }

            function buildSystemPrompt() {
                const w = getCurrentWorld();
                let p = w.prompt;
                const ps = appState.protagonistStatus;
                p += `\n【当前】${ps.name} | ${ps.location} | ${ps.time}`;
                const npcKeys = Object.keys(w.npcs);
                if (npcKeys.length) p += `\n已结识NPC: ${npcKeys.join(', ')}`;
                if (currentTargetNpc) p += `\n【当前对话目标: ${currentTargetNpc} - 必须在JSON中更新其npc_status】`;
                return p;
            }

            function processJson(text) {
                let jsonStr = null;
                const codeMatch = text.match(/```json\s*([\s\S]*?)```/);
                if (codeMatch) jsonStr = codeMatch[1].trim();
                if (!jsonStr) {
                    const braceMatch = text.match(/\{[\s\S]*\}/);
                    if (braceMatch) jsonStr = braceMatch[0];
                }
                if (!jsonStr) return;
                try {
                    const data = JSON.parse(jsonStr);
                    if (!data || Object.keys(data).length === 0) return;
                    const w = getCurrentWorld();
                    let changed = false;

                    if (data.npc_met && data.npc_met !== 'null' && data.npc_met.trim() !== '') {
                        const name = data.npc_met.trim();
                        if (!w.npcs[name]) {
                            w.npcs[name] = {
                                affection: 100,
                                description: data.npc_description || '',
                                status: data.npc_status || {},
                                metAt: Date.now()
                            };
                            addSystemMsg(`✨ 结识新NPC：${name}`);
                            checkAchievement('初次邂逅');
                            changed = true;
                        } else if (data.npc_description || data.npc_status) {
                            if (data.npc_description) w.npcs[name].description = data.npc_description;
                            if (data.npc_status) w.npcs[name].status = Object.assign(w.npcs[name].status || {}, data.npc_status);
                            changed = true;
                        }
                    }

                    if (typeof data.affection_change === 'number' && data.affection_change !== 0) {
                        const target = currentTargetNpc || Object.keys(w.npcs).pop();
                        if (target && w.npcs[target]) {
                            w.npcs[target].affection = Math.max(0, (w.npcs[target].affection || 100) + data.affection_change);
                            changed = true;
                        }
                    }

                    if (data.event) {
                        const mems = appState.memories[getWorldKey()] || [];
                        mems.push({ event: data.event, timestamp: Date.now() });
                        appState.memories[getWorldKey()] = mems;
                        changed = true;
                    }
                    if (data.location) { appState.protagonistStatus.location = data.location; changed = true; }
                    if (data.time) { appState.protagonistStatus.time = data.time; changed = true; }

                    if (changed) { saveState(); renderNpcStrip(); }
                } catch (e) { console.warn('JSON解析失败:', e.message); }
            }

            function checkAchievement(name) {
                if (!appState.achievements.find(a => a.name === name)) {
                    appState.achievements.push({ name, timestamp: Date.now() });
                    addSystemMsg(`🏆 成就解锁：${name}`);
                    saveState();
                }
            }

            // ==================== 启动 ====================
            renderAll();
            if (getCurrentWorld().messages.length === 0) {
                addSystemMsg(`欢迎来到 ${getCurrentWorld().emoji} ${getCurrentWorld().name}`);
            }
        })();
    </script>
</body>
</html>
