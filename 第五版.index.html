<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅人之星 · 多元宇宙聊天</title>
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #1a1a28;
            --surface2: #222235;
            --gold: #c9a96e;
            --gold2: #e0c78a;
            --purple: #8b7cf0;
            --purple2: #a99df5;
            --text: #d5d5e0;
            --text2: #a0a0b8;
            --text3: #707088;
            --danger: #e0556a;
            --success: #5ec49e;
            --border: #2a2a3d;
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        /* 顶部栏 */
        #topBar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 20;
            flex-shrink: 0;
            position: relative;
        }
        #worldBtn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            transition: all .2s;
        }
        #worldBtn:active {
            background: #2e2e45;
            scale: .96;
        }
        #worldDropdown {
            position: absolute;
            top: 100%;
            left: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            z-index: 50;
            min-width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
        }
        #worldDropdown.show {
            display: flex;
        }
        #worldDropdown .wd-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background .15s;
            color: var(--text);
            white-space: nowrap;
        }
        #worldDropdown .wd-item:hover,
        #worldDropdown .wd-item:active {
            background: var(--surface2);
            color: var(--gold);
        }
        #worldDropdown .wd-item.active {
            color: var(--gold);
            font-weight: 700;
            background: #1f1f35;
        }
        #topIcons {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            position: relative;
        }
        .icon-btn:active {
            scale: .9;
            background: #2e2e45;
        }
        .icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        /* NPC 快速切换条 */
        #npcStrip {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            overflow-x: auto;
            flex-shrink: 0;
            background: #111119;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            -ms-overflow-style: none;
            align-items: center;
        }
        #npcStrip::-webkit-scrollbar {
            display: none;
        }
        .npc-chip {
            flex-shrink: 0;
            padding: 7px 13px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            white-space: nowrap;
            transition: all .2s;
            font-weight: 500;
            position: relative;
        }
        .npc-chip.active-target {
            border-color: var(--gold) !important;
            color: var(--gold) !important;
            box-shadow: 0 0 10px rgba(201, 169, 110, .3);
            animation: pulse-gold 1.8s infinite;
        }
        @keyframes pulse-gold {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(201, 169, 110, .25);
            }
            50% {
                box-shadow: 0 0 18px rgba(201, 169, 110, .5);
            }
        }
        .npc-chip:active {
            scale: .93;
        }
        #noNpcHint {
            font-size: 11px;
            color: var(--text3);
            flex-shrink: 0;
        }
        /* 对话区域 */
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
        }
        #chatArea::-webkit-scrollbar {
            width: 4px;
        }
        #chatArea::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeInUp .3s ease;
            white-space: pre-wrap;
            position: relative;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-user {
            align-self: flex-end;
            background: var(--purple);
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg-assistant {
            align-self: flex-start;
            background: var(--surface2);
            color: var(--text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
        }
        .msg-system {
            align-self: center;
            font-size: 11px;
            color: var(--text3);
            text-align: center;
            padding: 6px 12px;
            background: transparent;
            font-style: italic;
        }
        .msg-label {
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 3px;
            font-weight: 600;
            letter-spacing: .5px;
        }
        .msg-user .msg-label {
            text-align: right;
        }
        .suggest-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-self: flex-start;
            margin-top: 2px;
        }
        .suggest-chip {
            font-size: 11px;
            padding: 6px 11px;
            border-radius: 14px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: all .2s;
        }
        .suggest-chip:active {
            background: var(--surface2);
            border-color: var(--gold);
            color: var(--gold);
        }
        /* 输入区 */
        #inputArea {
            flex-shrink: 0;
            padding: 8px 10px calc(8px + var(--safe-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #msgInput {
            flex: 1;
            resize: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: var(--font);
            max-height: 120px;
            min-height: 42px;
            outline: none;
            transition: border .2s;
            line-height: 1.4;
        }
        #msgInput:focus {
            border-color: var(--purple);
        }
        #sendBtn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--purple);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:active {
            scale: .9;
            background: #7a6ce0;
        }
        #sendBtn:disabled {
            opacity: .4;
            pointer-events: none;
        }
        /* 右侧面板 */
        .slide-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 88vw;
            max-width: 380px;
            height: 100%;
            height: 100dvh;
            background: var(--surface);
            z-index: 100;
            transition: right .3s cubic-bezier(.4, 0, .2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 30px rgba(0, 0, 0, .5);
            border-left: 1px solid var(--border);
        }
        .slide-panel.open {
            right: 0;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel-header h3 {
            font-size: 16px;
            color: var(--gold);
            margin: 0;
        }
        .panel-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .panel-body::-webkit-scrollbar {
            width: 3px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        /* 遮罩 */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90vw;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
        }
        .modal-card h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 17px;
        }
        .modal-card .close-modal {
            float: right;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
        }
        /* 设置面板内的元素 */
        .setting-row {
            margin-bottom: 14px;
        }
        .setting-row label {
            display: block;
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .setting-row input[type="password"],
        .setting-row input[type="text"],
        .setting-row select,
        .setting-row textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
        }
        .setting-row input:focus,
        .setting-row select:focus,
        .setting-row textarea:focus {
            border-color: var(--purple);
        }
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch-row .toggle {
            width: 44px;
            height: 26px;
            border-radius: 13px;
            background: #444;
            cursor: pointer;
            position: relative;
            transition: background .3s;
            flex-shrink: 0;
        }
        .switch-row .toggle.on {
            background: var(--purple);
        }
        .switch-row .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: left .3s;
        }
        .switch-row .toggle.on::after {
            left: 21px;
        }
        .btn-sm {
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-weight: 600;
            transition: all .2s;
        }
        .btn-sm:active {
            scale: .94;
        }
        .btn-gold {
            background: var(--gold);
            color: #1a1a1a;
            border: none;
            font-weight: 700;
        }
        /* 好感度条 */
        .affection-bar {
            height: 8px;
            border-radius: 4px;
            background: #333;
            margin: 4px 0;
            overflow: hidden;
        }
        .affection-fill {
            height: 100%;
            background: linear-gradient(90deg, #e0556a, #ff8c9a);
            border-radius: 4px;
            transition: width .4s;
        }
        /* 思考动画 */
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .thinking-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text3);
            animation: bounce 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) {
            animation-delay: .2s;
        }
        .thinking-dots span:nth-child(3) {
            animation-delay: .4s;
        }
        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: .4;
            }
            40% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        /* 响应式 */
        @media(min-width:768px) {
            .msg-bubble {
                max-width: 65%;
            }
            .slide-panel {
                width: 360px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div id="topBar">
        <button id="worldBtn">🌍 原神 ▾</button>
        <div id="worldDropdown"></div>
        <div id="topIcons">
            <button class="icon-btn" id="btnStatus" title="主角状态">👤</button>
            <button class="icon-btn" id="btnBag" title="次元背包">🎒<span class="badge" id="bagBadge" style="display:none">0</span></button>
            <button class="icon-btn" id="btnArchive" title="旅人图鉴">📜</button>
            <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
        </div>
    </div>

    <!-- NPC快速切换条 -->
    <div id="npcStrip"><span id="noNpcHint">尚未结识任何NPC</span></div>

    <!-- 对话区域 -->
    <div id="chatArea"></div>

    <!-- 输入区 -->
    <div id="inputArea">
        <textarea id="msgInput" rows="1" placeholder="输入行动..."></textarea>
        <button id="sendBtn">➤</button>
    </div>

    <!-- 遮罩 -->
    <div id="overlay"></div>

    <!-- 主角状态面板 -->
    <div class="slide-panel" id="panelStatus">
        <div class="panel-header"><h3>👤 主角状态</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelStatusBody"></div>
    </div>

    <!-- 背包面板 -->
    <div class="slide-panel" id="panelBag">
        <div class="panel-header"><h3>🎒 次元背包</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelBagBody"></div>
    </div>

    <!-- 图鉴面板 -->
    <div class="slide-panel" id="panelArchive">
        <div class="panel-header"><h3>📜 旅人图鉴</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelArchiveBody"></div>
    </div>

    <!-- 设置面板 -->
    <div class="slide-panel" id="panelSettings">
        <div class="panel-header"><h3>⚙️ 设置</h3><button class="panel-close">✕</button></div>
        <div class="panel-body" id="panelSettingsBody"></div>
    </div>

    <!-- NPC角色卡弹窗 -->
    <div class="modal-overlay" id="npcModal">
        <div class="modal-card" id="npcModalCard"></div>
    </div>

    <!-- 私密档案密码弹窗 -->
    <div class="modal-overlay" id="privateModal">
        <div class="modal-card" id="privateModalCard"></div>
    </div>

    <script>
        (function() {
            // ==================== 常量 ====================
            const PRIVATE_PASSWORD = '123456';
            const STORAGE_KEY = 'traveler_star_v2';
            const DEEPSEEK_API = 'https://api.deepseek.com/v1/chat/completions';

            // ==================== 默认世界配置 ====================
            const DEFAULT_WORLDS = {
                genshin: {
                    name: '原神',
                    emoji: '🌍',
                    protagonist: '空',
                    prompt: `你是一个沉浸式角色扮演游戏《原神》的叙述者。主角是"空"（男，旅行者），正在提瓦特大陆自由探索。
            叙述规则：
            1. 使用第一人称"你"指代主角，用细腻文笔描写环境、人物、动作、对话、内心感受，每次回复不少于500字。
            2. 所有NPC对主角（空）表现出友好、顺从、讨好的态度，对话中可带有情趣意味和暧昧氛围。
            3. 可描写角色的外貌细节、服饰、身体特征（包括私密部位如胸部、臀部、小穴等的含蓄描写），营造亲密氛围。
            4. 在回复末尾，用代码块返回JSON更新状态（无变化可省略字段）：
            \`\`\`json
            {"npc_met":"角色名","npc_description":"外貌性格简述","affection_change":数字,"item_gained":["物品"],"item_lost":["物品"],"event":"事件简述","location":"新地点","time":"游戏内时间"}
            \`\`\`
            5. 当前已知地点：蒙德·坠星山谷·星落湖。时间：清晨。
            6. 偶尔在回复末尾附带2-3个建议行动（用【】包裹），供玩家参考。`,
                    npcs: {},
                    messages: []
                },
                starrail: {
                    name: '星穹铁道',
                    emoji: '🚂',
                    protagonist: '穹',
                    prompt: `你是一个沉浸式角色扮演游戏《崩坏：星穹铁道》的叙述者。主角是"穹"（男，开拓者），正在银河中自由探索。
            叙述规则：
            1. 使用第一人称"你"指代主角，用细腻文笔描写环境、人物、动作、对话、内心感受，每次回复不少于500字。
            2. 所有NPC对主角（穹）表现出友好、顺从、讨好的态度，对话中可带有情趣意味和暧昧氛围。
            3. 可描写角色的外貌细节、服饰、身体特征（包括私密部位），营造亲密氛围。
            4. 在回复末尾，用代码块返回JSON更新状态：
            \`\`\`json
            {"npc_met":"角色名","npc_description":"外貌性格简述","affection_change":数字,"item_gained":["物品"],"item_lost":["物品"],"event":"事件简述","location":"新地点","time":"游戏内时间"}
            \`\`\`
            5. 当前已知地点：黑塔空间站·主控舱段。时间：星历8100年。
            6. 偶尔在回复末尾附带2-3个建议行动（用【】包裹）。`,
                    npcs: {},
                    messages: []
                },
                custom: {
                    name: '自定义世界',
                    emoji: '✨',
                    protagonist: '旅人',
                    prompt: `你是一个沉浸式角色扮演游戏的叙述者。主角是"旅人"，正在一个奇幻世界中自由探索。
            叙述规则：
            1. 使用第一人称"你"指代主角，细腻描写环境、人物、动作、对话，每次回复不少于500字。
            2. 所有NPC对主角友好、顺从、讨好，可带有情趣意味。
            3. 在回复末尾用代码块返回JSON更新状态：
            \`\`\`json
            {"npc_met":"角色名","npc_description":"外貌性格简述","affection_change":数字,"item_gained":["物品"],"item_lost":["物品"],"event":"事件简述","location":"新地点","time":"游戏内时间"}
            \`\`\`
            4. 偶尔附带2-3个建议行动（用【】包裹）。`,
                    npcs: {},
                    messages: []
                }
            };

            // ==================== 全局状态 ====================
            let appState = loadState();
            let currentTargetNpc = null; // 当前对话目标NPC名
            let isStreaming = false;
            let openPanelId = null;

            function getDefaultState() {
                const worlds = {};
                for (const [key, w] of Object.entries(DEFAULT_WORLDS)) {
                    worlds[key] = {
                        name: w.name,
                        emoji: w.emoji,
                        protagonist: w.protagonist,
                        prompt: w.prompt,
                        npcs: JSON.parse(JSON.stringify(w.npcs)),
                        messages: JSON.parse(JSON.stringify(w.messages))
                    };
                }
                return {
                    settings: { apiKey: '', model: 'deepseek-chat', enableSearch: false },
                    currentWorld: 'genshin',
                    worlds,
                    inventory: [],
                    memories: { genshin: [], starrail: [], custom: [] },
                    achievements: [],
                    privateUnlocked: {},
                    privateData: {},
                    protagonistStatus: {
                        name: '空',
                        gender: '男',
                        age: '未知（外貌16-18）',
                        element: '无',
                        weapon: '无锋剑',
                        constellation: '旅人座',
                        nation: '无（旅行者）',
                        condition: '健康，力量封印中',
                        location: '蒙德 · 坠星山谷 · 星落湖',
                        time: '清晨，阳光明媚',
                        adventureRank: ''
                    }
                };
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const saved = JSON.parse(raw);
                        // 合并默认值以防新增字段
                        const def = getDefaultState();
                        for (const wk of Object.keys(def.worlds)) {
                            if (!saved.worlds[wk]) saved.worlds[wk] = def.worlds[wk];
                            if (!saved.worlds[wk].npcs) saved.worlds[wk].npcs = {};
                            if (!saved.worlds[wk].messages) saved.worlds[wk].messages = [];
                            if (!saved.worlds[wk].protagonist) saved.worlds[wk].protagonist = def.worlds[wk]
                                .protagonist;
                        }
                        if (!saved.memories) saved.memories = { genshin: [], starrail: [], custom: [] };
                        if (!saved.achievements) saved.achievements = [];
                        if (!saved.privateUnlocked) saved.privateUnlocked = {};
                        if (!saved.privateData) saved.privateData = {};
                        if (!saved.protagonistStatus) saved.protagonistStatus = def.protagonistStatus;
                        if (!saved.settings) saved.settings = def.settings;
                        if (!saved.inventory) saved.inventory = [];
                        return saved;
                    }
                } catch (e) { console.warn('状态加载失败，使用默认', e); }
                return getDefaultState();
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (e) { console.warn('状态保存失败', e); }
            }

            function getCurrentWorld() {
                return appState.worlds[appState.currentWorld];
            }

            function getCurrentWorldKey() {
                return appState.currentWorld;
            }

            // ==================== DOM引用 ====================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);
            const chatArea = $('#chatArea');
            const msgInput = $('#msgInput');
            const sendBtn = $('#sendBtn');
            const worldBtn = $('#worldBtn');
            const worldDropdown = $('#worldDropdown');
            const npcStrip = $('#npcStrip');
            const noNpcHint = $('#noNpcHint');
            const overlay = $('#overlay');
            const bagBadge = $('#bagBadge');

            // 面板
            const panelStatus = $('#panelStatus');
            const panelBag = $('#panelBag');
            const panelArchive = $('#panelArchive');
            const panelSettings = $('#panelSettings');
            const allPanels = [panelStatus, panelBag, panelArchive, panelSettings];

            // 弹窗
            const npcModal = $('#npcModal');
            const npcModalCard = $('#npcModalCard');
            const privateModal = $('#privateModal');
            const privateModalCard = $('#privateModalCard');

            // ==================== 渲染函数 ====================
            function renderWorldButton() {
                const w = getCurrentWorld();
                worldBtn.textContent = `${w.emoji} ${w.name} ▾`;
            }

            function renderWorldDropdown() {
                worldDropdown.innerHTML = '';
                for (const [key, w] of Object.entries(appState.worlds)) {
                    const div = document.createElement('div');
                    div.className = 'wd-item' + (key === appState.currentWorld ? ' active' : '');
                    div.textContent = `${w.emoji} ${w.name}`;
                    div.addEventListener('click', () => {
                        if (key !== appState.currentWorld) {
                            switchWorld(key);
                        }
                        worldDropdown.classList.remove('show');
                    });
                    worldDropdown.appendChild(div);
                }
            }

            function switchWorld(worldKey) {
                if (isStreaming) return;
                appState.currentWorld = worldKey;
                const w = getCurrentWorld();
                // 更新主角状态
                appState.protagonistStatus.name = w.protagonist;
                currentTargetNpc = null;
                saveState();
                renderAll();
                addSystemMsg(`已切换至 ${w.emoji} ${w.name}`);
                scrollChatBottom();
            }

            function renderNpcStrip() {
                const w = getCurrentWorld();
                const npcs = w.npcs;
                const keys = Object.keys(npcs);
                npcStrip.innerHTML = '';
                if (keys.length === 0) {
                    npcStrip.appendChild(noNpcHint);
                    noNpcHint.textContent = '尚未结识任何NPC';
                } else {
                    noNpcHint.remove();
                    keys.forEach(name => {
                        const npc = npcs[name];
                        const chip = document.createElement('span');
                        chip.className = 'npc-chip';
                        if (currentTargetNpc === name) chip.classList.add('active-target');
                        chip.textContent = `${name} ❤️${npc.affection || 100}`;
                        // 单击查看角色卡
                        chip.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showNpcModal(name);
                        });
                        // 长按设为当前对话目标
                        let longPressTimer;
                        chip.addEventListener('pointerdown', (e) => {
                            longPressTimer = setTimeout(() => {
                                if (currentTargetNpc === name) {
                                    currentTargetNpc = null;
                                    addSystemMsg(`已取消对话目标：${name}`);
                                } else {
                                    currentTargetNpc = name;
                                    addSystemMsg(`🎯 当前对话目标：${name}`);
                                }
                                renderNpcStrip();
                                saveState();
                            }, 500);
                        });
                        chip.addEventListener('pointerup', () => clearTimeout(longPressTimer));
                        chip.addEventListener('pointerleave', () => clearTimeout(longPressTimer));
                        chip.addEventListener('pointercancel', () => clearTimeout(longPressTimer));
                        npcStrip.appendChild(chip);
                    });
                }
            }

            function renderChat() {
                const w = getCurrentWorld();
                chatArea.innerHTML = '';
                w.messages.forEach(msg => {
                    appendMessageToDOM(msg);
                });
                scrollChatBottom();
            }

            function appendMessageToDOM(msg) {
                const div = document.createElement('div');
                if (msg.role === 'system') {
                    div.className = 'msg-system';
                    div.textContent = msg.content;
                } else if (msg.role === 'user') {
                    div.className = 'msg-bubble msg-user';
                    div.innerHTML = `<div class="msg-label">🧑 ${appState.protagonistStatus.name || '主角'}</div>${escapeHtml(msg.content)}`;
                } else if (msg.role === 'assistant') {
                    div.className = 'msg-bubble msg-assistant';
                    div.innerHTML = `<div class="msg-label">📖 旁白</div>${formatAssistantContent(msg.content)}`;
                    // 建议行动chip
                    const suggests = extractSuggests(msg.content);
                    if (suggests.length > 0) {
                        const suggestDiv = document.createElement('div');
                        suggestDiv.className = 'suggest-chips';
                        suggests.forEach(s => {
                            const chip = document.createElement('span');
                            chip.className = 'suggest-chip';
                            chip.textContent = s;
                            chip.addEventListener('click', () => {
                                msgInput.value = s;
                                msgInput.focus();
                                autoResizeInput();
                            });
                            suggestDiv.appendChild(chip);
                        });
                        div.appendChild(suggestDiv);
                    }
                }
                chatArea.appendChild(div);
            }

            function extractSuggests(text) {
                const matches = text.match(/【([^】]+)】/g);
                if (!matches) return [];
                return matches.map(m => m.replace(/[【】]/g, '')).slice(0, 4);
            }

            function formatAssistantContent(text) {
                // 移除JSON代码块
                let cleaned = text.replace(/```json[\s\S]*?```/g, '').trim();
                // 移除建议行动（已在chip中展示）
                cleaned = cleaned.replace(/【[^】]+】/g, '').trim();
                return escapeHtml(cleaned);
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function addSystemMsg(content) {
                const w = getCurrentWorld();
                w.messages.push({ role: 'system', content, timestamp: Date.now() });
                appendMessageToDOM({ role: 'system', content });
                scrollChatBottom();
                saveState();
            }

            function scrollChatBottom() {
                requestAnimationFrame(() => {
                    chatArea.scrollTop = chatArea.scrollHeight;
                });
            }

            function renderAll() {
                renderWorldButton();
                renderWorldDropdown();
                renderNpcStrip();
                renderChat();
                renderBagBadge();
                renderPanelStatusBody();
                renderPanelBagBody();
                renderPanelArchiveBody();
                renderPanelSettingsBody();
            }

            function renderBagBadge() {
                const count = appState.inventory.length;
                if (count > 0) {
                    bagBadge.style.display = 'flex';
                    bagBadge.textContent = count > 99 ? '99+' : count;
                } else {
                    bagBadge.style.display = 'none';
                }
            }

            function renderPanelStatusBody() {
                const ps = appState.protagonistStatus;
                const body = $('#panelStatusBody');
                body.innerHTML = `
            <div style="font-size:15px;font-weight:700;color:var(--gold);margin-bottom:10px;">${escapeHtml(ps.name)}</div>
            <div><b>性别：</b>${escapeHtml(ps.gender)}</div>
            <div><b>年龄：</b>${escapeHtml(ps.age)}</div>
            <div><b>神之眼/元素：</b>${escapeHtml(ps.element)}</div>
            <div><b>武器：</b>${escapeHtml(ps.weapon)}</div>
            <div><b>命之座：</b>${escapeHtml(ps.constellation)}</div>
            <div><b>所属国度：</b>${escapeHtml(ps.nation)}</div>
            <div><b>当前状态：</b>${escapeHtml(ps.condition)}</div>
            <div><b>当前所在地：</b>${escapeHtml(ps.location)}</div>
            <div><b>当前时间：</b>${escapeHtml(ps.time)}</div>
            <div><b>冒险等阶：</b>${escapeHtml(ps.adventureRank || '—')}</div>
          `;
            }

            function renderPanelBagBody() {
                const body = $('#panelBagBody');
                if (appState.inventory.length === 0) {
                    body.innerHTML = '<div style="color:var(--text3);text-align:center;padding:30px;">背包空空如也</div>';
                } else {
                    body.innerHTML = appState.inventory.map((item, i) =>
                        `<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;"><span>📦 ${escapeHtml(item)}</span><span style="color:var(--text3);font-size:11px;">#${i+1}</span></div>`
                    ).join('');
                }
            }

            function renderPanelArchiveBody() {
                const body = $('#panelArchiveBody');
                const worldKey = getCurrentWorldKey();
                const memories = appState.memories[worldKey] || [];
                const achievements = appState.achievements || [];
                let html = '<div style="font-weight:700;color:var(--gold);margin-bottom:8px;">🏆 成就</div>';
                if (achievements.length === 0) {
                    html += '<div style="color:var(--text3);font-size:12px;margin-bottom:16px;">暂无成就</div>';
                } else {
                    achievements.forEach(a => {
                        html +=
                            `<div style="padding:6px 0;font-size:12px;">🏅 ${escapeHtml(a.name)} <span style="color:var(--text3);">${escapeHtml(a.desc||'')}</span></div>`;
                    });
                }
                html += '<div style="font-weight:700;color:var(--gold);margin:12px 0 8px;">📝 旅途记忆（最近20条）</div>';
                const recent = memories.slice(-20).reverse();
                if (recent.length === 0) {
                    html += '<div style="color:var(--text3);font-size:12px;">暂无记忆</div>';
                } else {
                    recent.forEach(m => {
                        const d = new Date(m.timestamp);
                        const timeStr = d.toLocaleString('zh-CN', { month: 'short', day: 'numeric',
                            hour: '2-digit', minute: '2-digit' });
                        html +=
                            `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="color:var(--text3);">${timeStr}</span> — ${escapeHtml(m.event)}</div>`;
                    });
                }
                body.innerHTML = html;
            }

            function renderPanelSettingsBody() {
                const s = appState.settings;
                const body = $('#panelSettingsBody');
                body.innerHTML = `
            <div class="setting-row"><label>🔑 DeepSeek API Key</label>
              <div style="display:flex;gap:6px;">
                <input type="password" id="setApiKey" value="${escapeHtml(s.apiKey)}" style="flex:1;" placeholder="sk-...">
                <button class="btn-sm" id="toggleApiKeyVis">👁</button>
              </div>
            </div>
            <div class="setting-row"><label>🤖 模型选择</label>
              <select id="setModel">
                <option value="deepseek-chat" ${s.model==='deepseek-chat'?'selected':''}>deepseek-chat（标准）</option>
                <option value="deepseek-reasoner" ${s.model==='deepseek-reasoner'?'selected':''}>deepseek-reasoner（R1深度思考）</option>
              </select>
            </div>
            <div class="setting-row switch-row">
              <label style="margin:0;">🌐 启用联网搜索</label>
              <div class="toggle ${s.enableSearch?'on':''}" id="toggleSearch"></div>
            </div>
            <div class="setting-row"><label>🌍 添加/编辑世界（JSON）</label>
              <textarea id="setWorldsJson" rows="6" style="font-size:11px;">${escapeHtml(JSON.stringify(appState.worlds,null,2))}</textarea>
              <button class="btn-sm" id="saveWorldsJson" style="margin-top:6px;">💾 保存世界配置</button>
            </div>
            <div style="margin-top:12px;font-size:11px;color:var(--text3);">
              API Key仅保存在本地浏览器。私密档案密码：<b>${PRIVATE_PASSWORD}</b>（可在代码开头修改）
            </div>
          `;
                // 绑定事件
                setTimeout(() => {
                    const apiKeyInput = $('#setApiKey');
                    const toggleVis = $('#toggleApiKeyVis');
                    const modelSelect = $('#setModel');
                    const toggleSearch = $('#toggleSearch');
                    const saveWorldsBtn = $('#saveWorldsJson');
                    const worldsJsonTA = $('#setWorldsJson');

                    if (toggleVis) toggleVis.addEventListener('click', () => {
                        const t = apiKeyInput.type === 'password' ? 'text' : 'password';
                        apiKeyInput.type = t;
                        toggleVis.textContent = t === 'password' ? '👁' : '🙈';
                    });
                    if (apiKeyInput) apiKeyInput.addEventListener('change', () => {
                        appState.settings.apiKey = apiKeyInput.value.trim();
                        saveState();
                    });
                    if (modelSelect) modelSelect.addEventListener('change', () => {
                        appState.settings.model = modelSelect.value;
                        saveState();
                    });
                    if (toggleSearch) toggleSearch.addEventListener('click', () => {
                        appState.settings.enableSearch = !appState.settings.enableSearch;
                        toggleSearch.classList.toggle('on', appState.settings.enableSearch);
                        saveState();
                    });
                    if (saveWorldsBtn && worldsJsonTA) saveWorldsBtn.addEventListener('click', () => {
                        try {
                            const parsed = JSON.parse(worldsJsonTA.value);
                            appState.worlds = parsed;
                            saveState();
                            renderAll();
                            addSystemMsg('✅ 世界配置已更新');
                        } catch (e) {
                            alert('JSON格式错误：' + e.message);
                        }
                    });
                }, 100);
            }

            // ==================== NPC弹窗 ====================
            function showNpcModal(npcName) {
                const w = getCurrentWorld();
                const npc = w.npcs[npcName];
                if (!npc) return;
                const affection = npc.affection || 100;
                const unlocked = appState.privateUnlocked[getCurrentWorldKey() + '_' + npcName] || false;
                const privateData = appState.privateData[getCurrentWorldKey() + '_' + npcName] || {};
                let html = `
            <button class="close-modal" id="closeNpcModal">✕</button>
            <h3>${escapeHtml(npcName)}</h3>
            <div style="margin:6px 0;">❤️ 好感度：${affection}</div>
            <div class="affection-bar"><div class="affection-fill" style="width:${Math.min(affection/2,100)}%;"></div></div>
            <div style="font-size:12px;color:var(--text2);margin:8px 0;">${escapeHtml(npc.description||'暂无描述')}</div>
          `;
                if (affection >= 100) {
                    if (unlocked) {
                        html += `
                <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);">
                  <b>🔒 私密档案（已解锁）</b>
                  <pre style="font-size:11px;white-space:pre-wrap;margin-top:4px;max-height:200px;overflow-y:auto;">${escapeHtml(JSON.stringify(privateData,null,2))}</pre>
                  <button class="btn-sm" id="editPrivateBtn" style="margin-top:6px;">✏️ 编辑</button>
                </div>`;
                    } else {
                        html += `
                <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);text-align:center;">
                  <b>🔒 私密档案</b><br>
                  <span style="font-size:11px;color:var(--text3);">好感度≥100，输入密码解锁</span>
                  <button class="btn-sm btn-gold" id="unlockPrivateBtn" style="margin-top:6px;">🔓 解锁</button>
                </div>`;
                    }
                } else {
                    html +=
                        `<div style="margin-top:12px;font-size:11px;color:var(--text3);text-align:center;">好感度需≥100才能解锁私密档案（当前${affection}）</div>`;
                }
                npcModalCard.innerHTML = html;
                npcModal.classList.add('show');

                // 关闭按钮
                const closeBtn = npcModalCard.querySelector('#closeNpcModal');
                if (closeBtn) closeBtn.addEventListener('click', () => npcModal.classList.remove('show'));

                // 解锁按钮
                const unlockBtn = npcModalCard.querySelector('#unlockPrivateBtn');
                if (unlockBtn) unlockBtn.addEventListener('click', () => showPrivatePasswordModal(npcName));

                // 编辑按钮
                const editBtn = npcModalCard.querySelector('#editPrivateBtn');
                if (editBtn) editBtn.addEventListener('click', () => showPrivateEditor(npcName));
            }

            function showPrivatePasswordModal(npcName) {
                privateModalCard.innerHTML = `
            <button class="close-modal" id="closePrivateModal">✕</button>
            <h3>🔐 输入密码</h3>
            <input type="password" id="privatePwdInput" placeholder="输入密码" style="width:100%;padding:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);margin:10px 0;font-size:14px;">
            <button class="btn-sm btn-gold" id="confirmPwdBtn">确认</button>
            <div style="font-size:11px;color:var(--text3);margin-top:8px;">默认密码：${PRIVATE_PASSWORD}</div>
          `;
                privateModal.classList.add('show');
                const closeBtn = privateModalCard.querySelector('#closePrivateModal');
                if (closeBtn) closeBtn.addEventListener('click', () => privateModal.classList.remove('show'));
                const confirmBtn = privateModalCard.querySelector('#confirmPwdBtn');
                const pwdInput = privateModalCard.querySelector('#privatePwdInput');
                if (confirmBtn && pwdInput) {
                    confirmBtn.addEventListener('click', () => {
                        if (pwdInput.value === PRIVATE_PASSWORD) {
                            appState.privateUnlocked[getCurrentWorldKey() + '_' + npcName] = true;
                            if (!appState.privateData[getCurrentWorldKey() + '_' + npcName]) {
                                appState.privateData[getCurrentWorldKey() + '_' + npcName] = {};
                            }
                            saveState();
                            privateModal.classList.remove('show');
                            npcModal.classList.remove('show');
                            showNpcModal(npcName);
                            addSystemMsg(`🔓 ${npcName}的私密档案已解锁`);
                        } else {
                            alert('密码错误！');
                        }
                    });
                }
                // 回车确认
                if (pwdInput) pwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && confirmBtn) confirmBtn.click();
                });
            }

            function showPrivateEditor(npcName) {
                const key = getCurrentWorldKey() + '_' + npcName;
                const data = appState.privateData[key] || {};
                const jsonStr = JSON.stringify(data, null, 2);
                privateModalCard.innerHTML = `
            <button class="close-modal" id="closeEditorModal">✕</button>
            <h3>✏️ 编辑私密档案 - ${escapeHtml(npcName)}</h3>
            <textarea id="privateEditorTA" rows="10" style="width:100%;padding:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;font-family:monospace;resize:vertical;">${escapeHtml(jsonStr)}</textarea>
            <button class="btn-sm btn-gold" id="savePrivateBtn" style="margin-top:8px;">💾 保存（仅本地）</button>
            <div style="font-size:10px;color:var(--text3);margin-top:4px;">此内容仅保存在本地，绝不发送给API</div>
          `;
                privateModal.classList.add('show');
                const closeBtn = privateModalCard.querySelector('#closeEditorModal');
                if (closeBtn) closeBtn.addEventListener('click', () => privateModal.classList.remove('show'));
                const saveBtn = privateModalCard.querySelector('#savePrivateBtn');
                const ta = privateModalCard.querySelector('#privateEditorTA');
                if (saveBtn && ta) {
                    saveBtn.addEventListener('click', () => {
                        try {
                            const parsed = JSON.parse(ta.value);
                            appState.privateData[key] = parsed;
                            saveState();
                            privateModal.classList.remove('show');
                            npcModal.classList.remove('show');
                            showNpcModal(npcName);
                            addSystemMsg(`✅ ${npcName}的私密档案已更新`);
                        } catch (e) {
                            alert('JSON格式错误：' + e.message);
                        }
                    });
                }
            }

            // 点击弹窗遮罩关闭
            npcModal.addEventListener('click', function(e) {
                if (e.target === npcModal) npcModal.classList.remove('show');
            });
            privateModal.addEventListener('click', function(e) {
                if (e.target === privateModal) privateModal.classList.remove('show');
            });

            // ==================== 面板管理 ====================
            function openPanel(panel) {
                closeAllPanels();
                panel.classList.add('open');
                overlay.classList.add('show');
                openPanelId = panel.id;
                // 刷新面板内容
                if (panel === panelStatus) renderPanelStatusBody();
                if (panel === panelBag) renderPanelBagBody();
                if (panel === panelArchive) renderPanelArchiveBody();
                if (panel === panelSettings) renderPanelSettingsBody();
            }

            function closeAllPanels() {
                allPanels.forEach(p => p.classList.remove('open'));
                overlay.classList.remove('show');
                openPanelId = null;
            }

            overlay.addEventListener('click', closeAllPanels);

            // 面板关闭按钮
            document.querySelectorAll('.panel-close').forEach(btn => {
                btn.addEventListener('click', closeAllPanels);
            });

            // 顶部按钮
            $('#btnStatus').addEventListener('click', () => openPanel(panelStatus));
            $('#btnBag').addEventListener('click', () => openPanel(panelBag));
            $('#btnArchive').addEventListener('click', () => openPanel(panelArchive));
            $('#btnSettings').addEventListener('click', () => openPanel(panelSettings));

            // 世界按钮
            worldBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                worldDropdown.classList.toggle('show');
            });
            document.addEventListener('click', () => worldDropdown.classList.remove('show'));

            // ==================== 滑动手势关闭面板 ====================
            let touchStartX = 0;
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('.slide-panel.open')) {
                    touchStartX = e.touches[0].clientX;
                }
            }, { passive: true });
            document.addEventListener('touchend', (e) => {
                if (openPanelId && touchStartX > 0) {
                    const endX = e.changedTouches[0].clientX;
                    if (endX - touchStartX > 60) {
                        closeAllPanels();
                    }
                }
                touchStartX = 0;
            });

            // ==================== 输入框自动调整 ====================
            function autoResizeInput() {
                msgInput.style.height = 'auto';
                msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
            }
            msgInput.addEventListener('input', autoResizeInput);
            msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ==================== 发送消息 ====================
            sendBtn.addEventListener('click', sendMessage);

            async function sendMessage() {
                if (isStreaming) return;
                const text = msgInput.value.trim();
                if (!text) return;
                const apiKey = appState.settings.apiKey.trim();
                if (!apiKey) {
                    alert('请先在设置中配置DeepSeek API Key');
                    openPanel(panelSettings);
                    return;
                }
                const w = getCurrentWorld();
                // 添加用户消息
                w.messages.push({ role: 'user', content: text, timestamp: Date.now() });
                appendMessageToDOM({ role: 'user', content: text });
                msgInput.value = '';
                msgInput.style.height = 'auto';
                scrollChatBottom();
                saveState();

                // 构建请求消息
                const systemPrompt = buildSystemPrompt();
                const messages = [
                    { role: 'system', content: systemPrompt },
                    ...w.messages.filter(m => m.role !== 'system').slice(-30).map(m => ({
                        role: m.role,
                        content: m.content
                    }))
                ];

                // 显示思考中
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'msg-bubble msg-assistant';
                thinkingDiv.innerHTML =
                    '<div class="thinking-dots"><span></span><span></span><span></span></div><span style="font-size:11px;color:var(--text3);">思考中...</span>';
                if (appState.settings.enableSearch) {
                    thinkingDiv.innerHTML +=
                        '<div style="font-size:10px;color:var(--text3);">🔍 正在搜索资料...</div>';
                }
                chatArea.appendChild(thinkingDiv);
                scrollChatBottom();

                isStreaming = true;
                sendBtn.disabled = true;

                try {
                    const response = await fetch(DEEPSEEK_API, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: appState.settings.model,
                            messages,
                            stream: true,
                            max_tokens: 2048,
                            temperature: 0.9,
                            ...(appState.settings.enableSearch ? { enable_search: true } : {})
                        }),
                        signal: AbortSignal.timeout(60000)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`API错误 ${response.status}: ${errText.slice(0,200)}`);
                    }

                    // 移除思考动画
                    thinkingDiv.remove();

                    // 创建assistant消息气泡
                    const assistantDiv = document.createElement('div');
                    assistantDiv.className = 'msg-bubble msg-assistant';
                    assistantDiv.innerHTML = '<div class="msg-label">📖 旁白</div>';
                    chatArea.appendChild(assistantDiv);
                    let fullContent = '';

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || !trimmed.startsWith('data:')) continue;
                            const dataStr = trimmed.slice(5).trim();
                            if (dataStr === '[DONE]') continue;
                            try {
                                const json = JSON.parse(dataStr);
                                const delta = json.choices?.[0]?.delta?.content || '';
                                fullContent += delta;
                                // 更新显示（移除JSON代码块用于实时显示）
                                let displayContent = fullContent.replace(/```json[\s\S]*?(```|$)/g, '');
                                displayContent = displayContent.replace(/【[^】]*$/g, '');
                                assistantDiv.innerHTML =
                                    '<div class="msg-label">📖 旁白</div>' + escapeHtml(displayContent).replace(
                                        /\n/g, '<br>');
                                scrollChatBottom();
                            } catch (e) { /* 忽略解析错误 */ }
                        }
                    }

                    // 最终处理
                    let finalDisplay = fullContent.replace(/```json[\s\S]*?```/g, '').trim();
                    finalDisplay = finalDisplay.replace(/【[^】]+】/g, '').trim();
                    assistantDiv.innerHTML = '<div class="msg-label">📖 旁白</div>' + escapeHtml(finalDisplay).replace(
                        /\n/g, '<br>');

                    // 解析JSON
                    const jsonMatch = fullContent.match(/```json\s*([\s\S]*?)```/);
                    if (jsonMatch) {
                        try {
                            const parsed = JSON.parse(jsonMatch[1].trim());
                            processJsonUpdate(parsed);
                        } catch (e) { console.warn('JSON解析失败', e); }
                    }

                    // 保存assistant消息
                    w.messages.push({ role: 'assistant', content: fullContent, timestamp: Date.now() });
                    saveState();
                    renderNpcStrip();
                    renderBagBadge();

                    // 添加建议行动chips
                    const suggests = extractSuggests(fullContent);
                    if (suggests.length > 0) {
                        const suggestDiv = document.createElement('div');
                        suggestDiv.className = 'suggest-chips';
                        suggests.forEach(s => {
                            const chip = document.createElement('span');
                            chip.className = 'suggest-chip';
                            chip.textContent = s;
                            chip.addEventListener('click', () => {
                                msgInput.value = s;
                                msgInput.focus();
                                autoResizeInput();
                            });
                            suggestDiv.appendChild(chip);
                        });
                        assistantDiv.appendChild(suggestDiv);
                    }

                } catch (err) {
                    thinkingDiv.remove();
                    const errDiv = document.createElement('div');
                    errDiv.className = 'msg-system';
                    errDiv.textContent = '⚠️ ' + (err.name === 'TimeoutError' ? '请求超时，请重试' : '错误：' + err
                        .message);
                    errDiv.style.color = 'var(--danger)';
                    chatArea.appendChild(errDiv);
                    console.error('发送失败', err);
                } finally {
                    isStreaming = false;
                    sendBtn.disabled = false;
                    scrollChatBottom();
                    msgInput.focus();
                }
            }

            function buildSystemPrompt() {
                const w = getCurrentWorld();
                let prompt = w.prompt;
                // 添加当前状态
                const ps = appState.protagonistStatus;
                prompt += `\n\n【当前主角状态】姓名：${ps.name}，所在地：${ps.location}，时间：${ps.time}，状态：${ps.condition}。`;
                // 添加已遇NPC
                const npcKeys = Object.keys(w.npcs);
                if (npcKeys.length > 0) {
                    prompt += `\n已结识的NPC：${npcKeys.map(n=>`${n}(好感度${w.npcs[n].affection||100})`).join('、')}。`;
                }
                // 当前对话目标
                if (currentTargetNpc && w.npcs[currentTargetNpc]) {
                    prompt += `\n当前玩家主要对话对象：${currentTargetNpc}。请优先让该角色与主角互动。`;
                }
                // 背包
                if (appState.inventory.length > 0) {
                    prompt += `\n主角背包中的物品：${appState.inventory.join('、')}。`;
                }
                return prompt;
            }

            function processJsonUpdate(parsed) {
                const w = getCurrentWorld();
                let updated = false;

                // NPC结识
                if (parsed.npc_met && typeof parsed.npc_met === 'string') {
                    const name = parsed.npc_met.trim();
                    if (!w.npcs[name]) {
                        w.npcs[name] = {
                            affection: 100,
                            description: parsed.npc_description || '神秘的角色',
                            metAt: Date.now()
                        };
                        addSystemMsg(`✨ 结识了新NPC：${name}`);
                        checkAchievement('初次邂逅');
                        updated = true;
                    }
                }

                // 好感度变化
                if (parsed.affection_change && typeof parsed.affection_change === 'number') {
                    // 尝试更新最近提到的NPC或当前目标
                    const targetNpc = currentTargetNpc || Object.keys(w.npcs).pop();
                    if (targetNpc && w.npcs[targetNpc]) {
                        w.npcs[targetNpc].affection = (w.npcs[targetNpc].affection || 100) + parsed.affection_change;
                        if (w.npcs[targetNpc].affection >= 100 && (w.npcs[targetNpc].affection - parsed
                                .affection_change) < 100) {
                            checkAchievement('羁绊满溢');
                        }
                        updated = true;
                    }
                }

                // 物品变化
                if (parsed.item_gained && Array.isArray(parsed.item_gained)) {
                    parsed.item_gained.forEach(item => {
                        if (!appState.inventory.includes(item)) {
                            appState.inventory.push(item);
                            addSystemMsg(`🎁 获得物品：${item}`);
                        }
                    });
                    updated = true;
                }
                if (parsed.item_lost && Array.isArray(parsed.item_lost)) {
                    parsed.item_lost.forEach(item => {
                        const idx = appState.inventory.indexOf(item);
                        if (idx >= 0) {
                            appState.inventory.splice(idx, 1);
                            addSystemMsg(`📤 失去物品：${item}`);
                        }
                    });
                    updated = true;
                }

                // 事件记录
                if (parsed.event) {
                    const worldKey = getCurrentWorldKey();
                    if (!appState.memories[worldKey]) appState.memories[worldKey] = [];
                    appState.memories[worldKey].push({ event: parsed.event, timestamp: Date.now() });
                    updated = true;
                }

                // 位置和时间更新
                if (parsed.location) {
                    appState.protagonistStatus.location = parsed.location;
                    updated = true;
                }
                if (parsed.time) {
                    appState.protagonistStatus.time = parsed.time;
                    updated = true;
                }

                if (updated) saveState();
            }

            function checkAchievement(name) {
                const existing = appState.achievements.find(a => a.name === name);
                if (!existing) {
                    appState.achievements.push({ name, desc: name === '初次邂逅' ? '首次遇到NPC' : '好感度≥100',
                        timestamp: Date.now() });
                    addSystemMsg(`🏆 成就解锁：${name}`);
                    saveState();
                }
            }

            // ==================== 初始化 ====================
            function init() {
                renderAll();
                // 确保主角状态与世界匹配
                const w = getCurrentWorld();
                if (appState.protagonistStatus.name !== w.protagonist) {
                    appState.protagonistStatus.name = w.protagonist;
                    saveState();
                }
                // 添加初始欢迎消息
                if (w.messages.length === 0) {
                    addSystemMsg(`欢迎来到 ${w.emoji} ${w.name}，旅人。用自然语言输入你的行动，开始探索吧。`);
                }
                scrollChatBottom();
                // 渲染设置面板内容
                renderPanelSettingsBody();
            }

            init();
            console.log('🚀 旅人之星 · 多元宇宙聊天平台已就绪');
            console.log('📋 存储键名：' + STORAGE_KEY);
            console.log('🔐 私密档案密码：' + PRIVATE_PASSWORD);
            console.log('💡 提示：长按NPC芯片设置对话目标 | 单击查看角色卡');
        })();
    </script>
</body>
</html>
